<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Systems Modeler Pro</title>
  <link rel="stylesheet" href="pr3.css" />
  <link rel="stylesheet" href="workspace-polish.css" />
  <link rel="stylesheet" href="bdd-completion.css" />
  <link rel="stylesheet" href="catia-light.css" />
  <link rel="stylesheet" href="ibd.css" />
  <link rel="stylesheet" href="behavior.css" />
  <link rel="stylesheet" href="behavior-completion.css" />
  <link rel="stylesheet" href="behavior-message-notation.css" />
  <link rel="stylesheet" href="behavior-submachine.css" />
  <link rel="stylesheet" href="activity.css" />
</head>
<body>
  <header class="app-header">
    <div class="title-row">
      <div class="app-mark">S3</div>
      <div class="brand">Systems Modeler Pro</div>
      <nav class="workspace-tabs" aria-label="Workspace sections">
        <span class="workspace-tab">File</span><span class="workspace-tab active">Home</span><span class="workspace-tab">Diagram</span><span class="workspace-tab">Arrange</span><span class="workspace-tab">View</span><span class="workspace-tab">Help</span>
      </nav>
    </div>
    <div class="ribbon">
      <section class="ribbon-group"><div class="ribbon-actions"><button id="new-package" class="ribbon-command"><span class="command-icon">□</span><span>Package</span></button><button id="new-bdd" class="ribbon-command"><span class="command-icon">▤</span><span>BDD</span></button><button id="new-state-machine" class="ribbon-command"><span class="command-icon">◉</span><span>State Machine</span></button><button id="new-sequence" class="ribbon-command"><span class="command-icon">⇥</span><span>Sequence</span></button></div><div class="ribbon-label">Create</div></section>
      <section class="ribbon-group ribbon-context"><div class="context-title">Active Diagram</div><div id="active-diagram-summary" class="context-value">No diagram selected</div><div class="context-subtitle">Elements and properties follow this diagram</div><div class="ribbon-label">Context</div></section>
    </div>
    <div class="shell-command-host" aria-hidden="true"><button id="new-project"></button><button id="open-project"></button><button id="save-project"></button><button id="save-project-as"></button></div>
  </header>

  <div class="workspace">
    <aside class="left repository-panel"><div class="panel-title"><span>Model Repository</span></div><div class="panel-search"><input id="repository-search" placeholder="Search repository" /></div><div id="repository" class="repository panel-scroll" tabindex="0"></div></aside>
    <aside class="palette-panel"><div class="panel-title palette-title-row"><span id="palette-title">Elements</span><button id="collapse-palette" class="icon-button" title="Collapse palette">«</button></div><div id="palette" class="palette panel-scroll" tabindex="0"></div></aside>
    <section class="diagram-workspace"><div id="diagram-tabs" class="diagram-tabs"></div><main id="canvas" class="canvas"></main></section>
    <aside class="properties-panel"><div class="panel-title properties-title"><span>Properties</span></div><div id="properties" class="properties panel-scroll" tabindex="0"></div></aside>
  </div>

  <div class="statusbar"><span id="status">Starting Rust workspace…</span><span id="model-counts" class="status-counts"></span></div>
  <script src="app.js"></script>
  <script src="workspace-ux.js"></script>
  <script src="bdd-completion-ui.js"></script>
  <script src="bdd-extended-ui.js"></script>
  <script src="palette-icons.js"></script>
  <script src="bdd-feature-editing.js"></script>
  <script src="ibd-ui.js"></script>
  <script src="item-flow-ui.js"></script>
  <script src="behavior-ui.js"></script>
  <script src="behavior-ribbon.js"></script>
  <script src="ui-shell.js"></script>
  <script src="behavior-completion-ui.js"></script>
  <script src="behavior-atomic-message.js"></script>
  <script src="behavior-delete-ui.js"></script>
  <script src="behavior-message-notation.js"></script>
  <script src="behavior-submachine.js"></script>
  <script src="behavior-region-placement.js"></script>
  <script src="behavior-sequence-input.js"></script>
  <script src="behavior-command-authority.js"></script>
  <script src="behavior-authoritative-renderer.js"></script>
  <script src="behavior-transition-presentation.js"></script>
  <script src="activity-ui.js"></script>
  <script src="activity-rich-ui.js"></script>
  <script src="activity-navigation-ui.js"></script>
  <script src="activity-mutation-ui.js"></script>
  <script src="project-open-compat.js"></script>
  <script src="diagram-interaction.js"></script>
</body>
</html>
