<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Systems Modeler Pro</title>
  <link rel="stylesheet" href="pr3.css" />
</head>
<body>
  <header>
    <div class="brand">Systems Modeler Pro</div>
    <div class="toolbar">
      <button id="new-project">New Project</button>
      <button id="open-project">Open</button>
      <button id="save-project">Save</button>
      <button id="save-project-as">Save As</button>
      <button id="new-package">New Package</button>
      <button id="new-block">New Block</button>
      <button id="new-bdd">New BDD</button>
      <button id="place-block">Place Selected Block</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="left">
      <div class="panel-title">Model Repository</div>
      <div id="repository" class="repository"></div>
    </aside>
    <main id="canvas" class="canvas"></main>
    <aside class="properties-panel">
      <div class="panel-title">Properties</div>
      <div id="properties" class="properties"></div>
    </aside>
  </div>
  <div class="statusbar" id="status">Starting Rust workspace…</div>
  <script src="app.js"></script>
</body>
</html>
