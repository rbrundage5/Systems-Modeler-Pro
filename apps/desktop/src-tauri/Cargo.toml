[package]
name = "systems-modeler-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
systems-modeler-core = { path = "../../../crates/model-core" }
systems-modeler-persistence = { path = "../../../crates/persistence" }
calamine = "0.36.1"
rust_xlsxwriter = "0.92.0"
csv = "1.4.0"
roxmltree = "0.20.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
systems-modeler-server = { path = "../../server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tempfile = "3"
