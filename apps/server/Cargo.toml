[package]
name = "systems-modeler-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
systems-modeler-core = { path = "../../crates/model-core" }
systems-modeler-persistence = { path = "../../crates/persistence" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2 = "0.10.9"
bytes = "1"
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
