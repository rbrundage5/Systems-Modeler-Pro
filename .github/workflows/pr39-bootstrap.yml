name: pr39-bootstrap

on:
  push:
    branches: [agent/pr39-owned-feature-import]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr39-owned-feature-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply focused PR39 core patch
        run: python scripts/pr39_patch.py
      - name: Add PR39 fixture and focused tests
        run: python scripts/pr39_tests.py
      - name: Format
        run: cargo fmt --all
      - name: Check desktop
        run: cargo check -p systems-modeler-desktop
      - name: PR38 and PR39 spreadsheet tests
        run: cargo test -p systems-modeler-desktop spreadsheet_import -- --nocapture
      - name: PR36 bulk construction regression
        run: cargo test -p systems-modeler-desktop bulk_model
      - name: PR37 portable interchange regression
        run: cargo test -p systems-modeler-desktop portable_interchange
      - name: Desktop lint
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Commit qualified PR39 result
        run: |
          rm scripts/pr39_patch.py
          rm scripts/pr39_tests.py
          rm .github/workflows/pr39-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR39: CATIA-style owned feature and property import"
          git push origin HEAD:agent/pr39-owned-feature-import
