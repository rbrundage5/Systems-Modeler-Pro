name: pr11-itemflow-feedback
on:
  push:
    branches: [agent/pr11-complete-ibd-rust]
    paths: [.github/workflows/pr11-itemflow-feedback.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr11-complete-ibd-rust
      - name: Add immediate Item Flow feedback and properties
        shell: python
        run: |
          from pathlib import Path

          p=Path('apps/desktop/frontend/ibd-ui.js')
          s=p.read_text()
          old="""          const itemId = candidates[Number(answer) - 1]?.id;
          if (!itemId) return alert('Invalid conveyed classifier selection.');
          await runCommand('Adding Item Flow…', () => requireInvoke()('add_item_flow_to_connector', { relationshipId: relationship.id, conveyedItemIds: [itemId] }));
          await refresh();
          return;"""
          new="""          const conveyed = candidates[Number(answer) - 1];
          const itemId = conveyed?.id;
          if (!itemId) return alert('Invalid conveyed classifier selection.');
          const itemFlowId = await runCommand('Adding Item Flow…', () => requireInvoke()('add_item_flow_to_connector', { relationshipId: relationship.id, conveyedItemIds: [itemId] }));
          state.itemFlowNotice = {
            relationship_id: itemFlowId,
            connector_id: relationship.id,
            conveyed_item_ids: [itemId],
            conveyed_item_names: [conveyed.name],
          };
          state.selectedRelationshipId = relationship.id;
          await refresh();
          state.selectedRelationshipId = relationship.id;
          render();
          $('status').textContent = `Item Flow created: ${conveyed.name} on selected Connector`;
          return;"""
          if old not in s: raise SystemExit('Item Flow creation fragment not found')
          p.write_text(s.replace(old,new))

          p=Path('apps/desktop/frontend/item-flow-ui.js')
          s=p.read_text()
          old="""    const flowsByConnector = new Map();
    for (const flow of state.itemFlowNotation || []) {
      if (!flowsByConnector.has(flow.connector_id)) flowsByConnector.set(flow.connector_id, []);
      flowsByConnector.get(flow.connector_id).push(flow);
    }
"""
          new="""    const flowsByConnector = new Map();
    const flows = [...(state.itemFlowNotation || [])];
    if (state.itemFlowNotice && !flows.some((flow) => flow.relationship_id === state.itemFlowNotice.relationship_id)) {
      flows.push(state.itemFlowNotice);
    }
    for (const flow of flows) {
      if (!flowsByConnector.has(flow.connector_id)) flowsByConnector.set(flow.connector_id, []);
      flowsByConnector.get(flow.connector_id).push(flow);
    }
"""
          if old not in s: raise SystemExit('flow map fragment not found')
          s=s.replace(old,new)
          insert="""

  const baseRenderPropertiesItemFlow = renderProperties;
  renderProperties = function renderPropertiesWithItemFlows() {
    baseRenderPropertiesItemFlow();
    const diagram = selectedIbd();
    if (!diagram || !state.selectedRelationshipId) return;
    const relationship = state.snapshot?.project?.relationships?.find((r) => r.id === state.selectedRelationshipId);
    if (relationship?.kind !== 'Connector') return;
    const panel = $('properties');
    if (!panel) return;
    const flows = [...(state.itemFlowNotation || [])];
    if (state.itemFlowNotice && !flows.some((flow) => flow.relationship_id === state.itemFlowNotice.relationship_id)) flows.push(state.itemFlowNotice);
    const connectorFlows = flows.filter((flow) => flow.connector_id === relationship.id);
    const section = document.createElement('div');
    section.className = 'item-flow-properties';
    const rows = connectorFlows.length
      ? connectorFlows.map((flow) => `<div class=\"item-flow-property-row\"><strong>▶</strong> ${escapeHtml((flow.conveyed_item_names || []).join(', ') || 'conveyed item')}</div>`).join('')
      : '<div class=\"muted\">No Item Flows on this Connector.</div>';
    section.innerHTML = `<div class=\"property-heading\">Item Flows</div>${rows}`;
    panel.appendChild(section);
  };
"""
          marker="""  // Load notation immediately for an already-open project/IBD.
"""
          if marker not in s: raise SystemExit('item-flow properties insertion marker missing')
          p.write_text(s.replace(marker, insert + '\n' + marker))

          p=Path('apps/desktop/frontend/ibd.css')
          s=p.read_text()
          addition="""
.item-flow-properties{margin-top:14px;padding-top:10px;border-top:1px solid #bbb}.item-flow-property-row{margin:5px 0;padding:6px 8px;background:#f7f7f7;border:1px solid #ccc;font-size:12px}.item-flow-property-row strong{font-size:13px;margin-right:5px}
"""
          if '.item-flow-properties{' not in s:
              p.write_text(s + addition)
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/frontend/ibd-ui.js apps/desktop/frontend/item-flow-ui.js apps/desktop/frontend/ibd.css
          git commit -m "Make Item Flow creation visibly confirm on IBD"
          git push
