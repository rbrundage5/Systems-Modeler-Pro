name: pr60-bootstrap

on:
  push:
    branches: [agent/pr60-deterministic-model-script-import]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr60-deterministic-model-script-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply deterministic model-script patch
        run: python scripts/pr60_bootstrap.py
      - name: Format
        run: cargo fmt --all
      - name: Deterministic model-core child ordering
        run: cargo test -p systems-modeler-core --test pr60_deterministic_children -- --nocapture
      - name: Shared layout determinism
        run: cargo test -p systems-modeler-desktop equal_level_nodes_preserve_caller_order -- --nocapture
      - name: Dense nested-port model-script repeatability
        run: cargo test -p systems-modeler-desktop dense_nested_port -- --nocapture
      - name: Existing model-script qualification
        run: cargo test -p systems-modeler-desktop model_script -- --nocapture
      - name: Desktop check
        run: cargo check -p systems-modeler-desktop
      - name: Desktop lint
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Commit qualified PR60 implementation
        shell: pwsh
        run: |
          Remove-Item scripts/pr60_bootstrap.py
          Remove-Item .github/workflows/pr60-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR60: make model-script preview and apply deterministic"
          git push origin HEAD:agent/pr60-deterministic-model-script-import
