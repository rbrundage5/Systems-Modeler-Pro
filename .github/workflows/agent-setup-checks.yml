name: agent-setup-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate disabled configuration and bounded role contracts
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tomllib
          root = pathlib.Path(".")
          config = tomllib.loads((root / ".codex/config.toml").read_text())
          agents = config["agents"]
          assert agents["enabled"] is False
          assert agents["max_concurrent_threads_per_session"] == 3
          assert "default_subagent_model" not in agents
          assert "default_subagent_reasoning_effort" not in agents
          hook = config["hooks"]["PreToolUse"][0]
          assert hook["matcher"] == "^(spawn_agent|Agent)$"
          assert hook["hooks"][0]["command"] == 'smp_repo_root="$(git rev-parse --show-toplevel)" && python3 "$smp_repo_root/scripts/agent_preflight.py"'
          subprocess.run(["bash", "-n", "scripts/codex_cloud_setup.sh"], check=True)

          roles = list((root / ".codex/agents").glob("*.toml"))
          expected = {
              "coordinator", "code_auditor", "sysml_auditor", "behavior_auditor",
              "ux_auditor", "notation_auditor", "collaboration_auditor",
              "tool_gap_auditor", "implementer", "reviewer",
          }
          parsed = {}
          for path in roles:
              role = tomllib.loads(path.read_text())
              name = role["name"]
              assert name not in parsed
              parsed[name] = role
              assert all(role.get(k) for k in ("name", "description", "developer_instructions"))
              assert "model" not in role
              assert "model_reasoning_effort" not in role
              expected_mode = "workspace-write" if name == "implementer" else "read-only"
              assert role["sandbox_mode"] == expected_mode
          assert set(parsed) == expected

          coordinator = " ".join(parsed["coordinator"]["developer_instructions"].split()).lower()
          assert "never dispatch a whole" in coordinator
          assert "at most three" in coordinator
          assert "per-task model selection" in coordinator
          assert "do not bind a model to a role" in coordinator
          assert "requested and effective model/effort" in coordinator
          assert "use tool_gap_auditor" in coordinator
          for name in ("code_auditor", "sysml_auditor", "behavior_auditor", "ux_auditor", "notation_auditor", "collaboration_auditor"):
              instructions = " ".join(parsed[name]["developer_instructions"].split()).lower()
              assert "audit exactly one assigned child" in instructions
              assert "do not edit code" in instructions
          gap = " ".join(parsed["tool_gap_auditor"]["developer_instructions"].split()).lower()
          assert "compare exactly one assigned leaf capability or concrete workflow" in gap
          assert "one to three named professional sysml modeling tools" in gap
          assert "do not infer capability from roadmaps, enums or historical pr claims" in gap
          assert "evidence_gap" in gap
          assert "do not spawn agents, edit code or modify controls" in gap
          implementer = " ".join(parsed["implementer"]["developer_instructions"].split()).lower()
          reviewer = " ".join(parsed["reviewer"]["developer_instructions"].split()).lower()
          assert "implement exactly one validated child finding" in implementer
          assert "scope_too_large" in reviewer

          result = subprocess.run(["python3", "scripts/agent_preflight.py"], capture_output=True, text=True)
          assert result.returncode == 2
          assert "BLOCKED:" in result.stderr
          print("Configuration parses; role ownership is leaf-scoped; model routing is task-driven; professional-tool comparison is bounded; preflight refuses startup. Isolation is NOT qualified.")
          PY
      - name: Verify configured refusal command from portable checkout roots
        run: python3 -m unittest discover -s scripts -p 'test_agent_preflight_path.py' -v
