name: pr46-bootstrap
on:
  push:
    branches:
      - agent/pr46-operation-parameter-reception-import
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr46-operation-parameter-reception-import
      - name: Apply PR46 implementation
        run: python scripts/pr46_patch.py
      - name: Show focused test source
        shell: bash
        run: |
          nl -ba apps/desktop/src-tauri/src/workspace/spreadsheet_import/pr46_tests.rs | sed -n '1,760p'
      - name: Show PR46 spreadsheet implementation anchors
        shell: bash
        run: |
          grep -n -A45 -B20 'ParameterDirection\|AcceptedSignal\|ElementKind::Operation\|ElementKind::Reception\|ElementKind::Parameter' apps/desktop/src-tauri/src/workspace/spreadsheet_import.rs | head -n 1200
