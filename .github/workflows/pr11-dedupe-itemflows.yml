name: pr11-dedupe-itemflows
on:
  push:
    branches: [agent/pr11-complete-ibd-rust]
    paths: [.github/workflows/pr11-dedupe-itemflows.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr11-complete-ibd-rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Prevent and collapse duplicate Item Flows
        shell: python
        run: |
          from pathlib import Path

          p=Path('crates/model-core/src/lib.rs')
          s=p.read_text()
          old='''    pub fn create_item_flow(&mut self, flow: ItemFlow) -> Result<RelationshipId, ModelError> {
        let connector = self
            .relationship(flow.connector_id)
            .map_err(|_| ModelError::ItemFlowConnectorNotFound(flow.connector_id))?;
        if connector.kind != RelationshipKind::Connector || connector.connector.is_none() {
            return Err(ModelError::ItemFlowConnectorNotFound(flow.connector_id));
        }
        self.validate_item_flow(&flow)?;'''
          new='''    pub fn create_item_flow(&mut self, flow: ItemFlow) -> Result<RelationshipId, ModelError> {
        let connector = self
            .relationship(flow.connector_id)
            .map_err(|_| ModelError::ItemFlowConnectorNotFound(flow.connector_id))?;
        if connector.kind != RelationshipKind::Connector || connector.connector.is_none() {
            return Err(ModelError::ItemFlowConnectorNotFound(flow.connector_id));
        }
        let duplicate = self.relationships.values().any(|relationship| {
            relationship.item_flow.as_ref().is_some_and(|existing| {
                existing.connector_id == flow.connector_id
                    && existing.source == flow.source
                    && existing.target == flow.target
                    && existing.conveyed_item_ids == flow.conveyed_item_ids
            })
        });
        if duplicate {
            return Err(ModelError::DuplicateItemFlow(flow.connector_id));
        }
        self.validate_item_flow(&flow)?;'''
          if old not in s: raise SystemExit('create_item_flow anchor missing')
          s=s.replace(old,new)
          old2='''    #[error("item flow must realize an existing connector: {0}")]
    ItemFlowConnectorNotFound(RelationshipId),'''
          new2='''    #[error("item flow must realize an existing connector: {0}")]
    ItemFlowConnectorNotFound(RelationshipId),
    #[error("an identical item flow already exists on connector: {0}")]
    DuplicateItemFlow(RelationshipId),'''
          if old2 not in s: raise SystemExit('ModelError anchor missing')
          p.write_text(s.replace(old2,new2))

          p=Path('apps/desktop/frontend/item-flow-ui.js')
          s=p.read_text()
          old='''    const flowsByConnector = new Map();
    const flows = [...(state.itemFlowNotation || [])];
    if (state.itemFlowNotice && !flows.some((flow) => flow.relationship_id === state.itemFlowNotice.relationship_id)) {
      flows.push(state.itemFlowNotice);
    }
    for (const flow of flows) {
      if (!flowsByConnector.has(flow.connector_id)) flowsByConnector.set(flow.connector_id, []);
      flowsByConnector.get(flow.connector_id).push(flow);
    }'''
          new='''    const flowsByConnector = new Map();
    const flows = [...(state.itemFlowNotation || [])];
    if (state.itemFlowNotice && !flows.some((flow) => flow.relationship_id === state.itemFlowNotice.relationship_id)) {
      flows.push(state.itemFlowNotice);
    }
    const seenFlowKeys = new Set();
    for (const flow of flows) {
      const conveyedKey = [...(flow.conveyed_item_ids || [])].sort().join(',');
      const key = `${flow.connector_id}|${conveyedKey}`;
      if (seenFlowKeys.has(key)) continue;
      seenFlowKeys.add(key);
      if (!flowsByConnector.has(flow.connector_id)) flowsByConnector.set(flow.connector_id, []);
      flowsByConnector.get(flow.connector_id).push(flow);
    }'''
          if old not in s: raise SystemExit('renderer flow-map anchor missing')
          p.write_text(s.replace(old,new))
      - name: Format and test core
        run: |
          cargo fmt --all
          cargo test -p systems-modeler-core
          cargo clippy -p systems-modeler-core -- -D warnings
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/model-core/src/lib.rs apps/desktop/frontend/item-flow-ui.js
          git commit -m "Prevent duplicate Item Flows and collapse legacy duplicates"
          git push
