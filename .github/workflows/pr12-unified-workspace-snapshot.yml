name: pr12-unified-workspace-snapshot
on:
  push:
    branches: [agent/pr12-state-sequence-rust]
    paths: [.github/workflows/pr12-unified-workspace-snapshot.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr12-state-sequence-rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply unified workspace snapshot architecture
        shell: python
        run: |
          from pathlib import Path

          # Rust: one workspace snapshot contains structural + behavior state.
          p = Path('apps/desktop/src-tauri/src/workspace.rs')
          s = p.read_text()
          old = '''pub struct WorkspaceSnapshot {
              pub project: Option<ProjectSnapshot>,
              pub diagrams: Vec<BddDiagram>,
              pub ibd_diagrams: Vec<ibd::IbdDiagram>,
              pub current_file: Option<String>,
          }'''
          new = '''pub struct WorkspaceSnapshot {
              pub project: Option<ProjectSnapshot>,
              pub diagrams: Vec<BddDiagram>,
              pub ibd_diagrams: Vec<ibd::IbdDiagram>,
              pub behavior_repository: BehaviorRepository,
              pub behavior_diagrams: Vec<behavior_workspace::BehaviorDiagram>,
              pub current_file: Option<String>,
          }'''
          if old not in s: raise SystemExit('WorkspaceSnapshot anchor missing')
          s = s.replace(old, new)
          old = '''    let ibd_diagrams = state.ibd_diagrams.lock().map_err(|_| "IBD lock poisoned")?;
              let current_file = state.current_file.lock().map_err(|_| "project path lock poisoned")?;
              Ok(WorkspaceSnapshot {
                  project: project.as_ref().map(snapshot_project),
                  diagrams: diagrams.clone(),
                  ibd_diagrams: ibd_diagrams.clone(),
                  current_file: current_file.clone(),
              })'''
          new = '''    let ibd_diagrams = state.ibd_diagrams.lock().map_err(|_| "IBD lock poisoned")?;
              let behavior_repository = state.behavior.lock().map_err(|_| "behavior lock poisoned")?;
              let behavior_diagrams = state
                  .behavior_diagrams
                  .lock()
                  .map_err(|_| "behavior diagram lock poisoned")?;
              let current_file = state.current_file.lock().map_err(|_| "project path lock poisoned")?;
              Ok(WorkspaceSnapshot {
                  project: project.as_ref().map(snapshot_project),
                  diagrams: diagrams.clone(),
                  ibd_diagrams: ibd_diagrams.clone(),
                  behavior_repository: behavior_repository.clone(),
                  behavior_diagrams: behavior_diagrams.clone(),
                  current_file: current_file.clone(),
              })'''
          if old not in s: raise SystemExit('workspace_snapshot body anchor missing')
          p.write_text(s.replace(old, new))

          # app.js: Open must use the same unified refresh path as every other command.
          p = Path('apps/desktop/frontend/app.js')
          s = p.read_text()
          old = '''  state.snapshot = await requireInvoke()('workspace_snapshot');
            if (state.snapshot.diagrams.length) state.selectedDiagramId = state.snapshot.diagrams[0].id;
            await loadPalette();
            render();'''
          new = '''  await refresh();
            if (!state.selectedDiagramId && state.snapshot?.diagrams?.length) {
              state.selectedDiagramId = state.snapshot.diagrams[0].id;
              await loadPalette();
              render();
            }'''
          if old not in s: raise SystemExit('openProject bypass anchor missing')
          p.write_text(s.replace(old, new))

          # behavior-ui.js: derive behavior state from the unified Rust workspace snapshot.
          p = Path('apps/desktop/frontend/behavior-ui.js')
          s = p.read_text()
          anchor = '''  const MESSAGE_SORTS = new Set([
              'SynchCall', 'AsynchCall', 'AsynchSignal', 'Reply', 'Create', 'Delete', 'Lost', 'Found',
            ]);

            function activeBehaviorDiagram() {'''
          replacement = '''  const MESSAGE_SORTS = new Set([
              'SynchCall', 'AsynchCall', 'AsynchSignal', 'Reply', 'Create', 'Delete', 'Lost', 'Found',
            ]);

            function syncBehaviorSnapshotFromWorkspace() {
              if (state.snapshot?.behavior_repository && Array.isArray(state.snapshot?.behavior_diagrams)) {
                state.behaviorSnapshot = {
                  repository: state.snapshot.behavior_repository,
                  diagrams: state.snapshot.behavior_diagrams,
                };
              }
              return state.behaviorSnapshot;
            }

            function activeBehaviorDiagram() {
              syncBehaviorSnapshotFromWorkspace();'''
          if anchor not in s: raise SystemExit('behavior sync insertion anchor missing')
          s = s.replace(anchor, replacement)
          old = '''  async function loadBehaviorSnapshot() {
              try {
                state.behaviorSnapshot = await requireInvoke()('behavior_snapshot');
              } catch (error) {
                console.error('Unable to load Rust behavior workspace', error);
                state.behaviorSnapshot = {
                  repository: { state_machines: {}, interactions: {} },
                  diagrams: [],
                };
                throw error;
              }
            }'''
          new = '''  async function loadBehaviorSnapshot() {
              if (state.snapshot?.behavior_repository && Array.isArray(state.snapshot?.behavior_diagrams)) {
                return syncBehaviorSnapshotFromWorkspace();
              }
              try {
                state.behaviorSnapshot = await requireInvoke()('behavior_snapshot');
                return state.behaviorSnapshot;
              } catch (error) {
                console.error('Unable to load Rust behavior workspace', error);
                state.behaviorSnapshot = {
                  repository: { state_machines: {}, interactions: {} },
                  diagrams: [],
                };
                throw error;
              }
            }'''
          if old not in s: raise SystemExit('loadBehaviorSnapshot anchor missing')
          s = s.replace(old, new)
          old = '''    await baseRefresh();
              await loadBehaviorSnapshot();'''
          new = '''    await baseRefresh();
              syncBehaviorSnapshotFromWorkspace();'''
          if old not in s: raise SystemExit('refresh behavior anchor missing')
          s = s.replace(old, new)
          old = '''  renderDiagramTabs = function renderBehaviorDiagramTabs() {
              baseRenderDiagramTabs();'''
          new = '''  renderDiagramTabs = function renderBehaviorDiagramTabs() {
              syncBehaviorSnapshotFromWorkspace();
              baseRenderDiagramTabs();'''
          if old not in s: raise SystemExit('diagram tabs anchor missing')
          s = s.replace(old, new)
          old = '''  renderRepository = function renderBehaviorRepository() {
              baseRenderRepository();'''
          new = '''  renderRepository = function renderBehaviorRepository() {
              syncBehaviorSnapshotFromWorkspace();
              baseRenderRepository();'''
          if old not in s: raise SystemExit('repository anchor missing')
          s = s.replace(old, new)
          old = '''  loadBehaviorSnapshot().then(() => render()).catch((error) => {
              const status = $('status');
              if (status) status.textContent = `Behavior workspace unavailable: ${error?.message || String(error)}`;
            });'''
          new = '''  // app.js performs the initial workspace refresh. Behavior state is derived
            // from that same Rust snapshot to avoid startup/open races between two requests.
            syncBehaviorSnapshotFromWorkspace();'''
          if old not in s: raise SystemExit('startup behavior load anchor missing')
          p.write_text(s.replace(old, new))

          # Remove the redundant frontend open-project hydration patch.
          p = Path('apps/desktop/frontend/behavior-command-authority.js')
          s = p.read_text()
          marker = '''
            
              // app.js historically reloads only the structural workspace snapshot after
              // Open. Because behavior metadata is restored by Rust in the same project-open
              // command, hydrate the Rust behavior snapshot immediately after that handler
              // completes so saved STM/SEQ diagrams appear without creating another diagram.'''
          idx = s.find(marker)
          if idx != -1:
              s = s[:idx] + '\n})();\n'
          # Also collapse the command-boundary open hydration if present.
          command_block = '''      if (command === 'open_project_file') {
                return invoke(command, args).then(async (result) => {
                  await window.smpLoadBehaviorSnapshot?.();
                  return result;
                });
              }
          '''
          s = s.replace(command_block, '')
          p.write_text(s)

          # Add a real database round-trip test for behavior semantics + diagram presentation.
          p = Path('apps/desktop/src-tauri/src/workspace/behavior_workspace.rs')
          s = p.read_text()
          if 'behavior_metadata_database_round_trip_preserves_stm_and_seq_diagrams' not in s:
              s += r'''

          #[cfg(test)]
          mod behavior_metadata_database_tests {
              use super::*;

              #[test]
              fn behavior_metadata_database_round_trip_preserves_stm_and_seq_diagrams() {
                  let mut project = Project::new("Behavior Round Trip");
                  let package = project
                      .create_element(ElementKind::Package, "Behavior", project.root_id)
                      .expect("package");
                  let block = project
                      .create_element(ElementKind::Block, "Controller", package)
                      .expect("block");

                  let mut repository = BehaviorRepository::default();
                  let state_machine_id = repository
                      .create_state_machine(&project, block, "Controller States")
                      .expect("state machine");
                  let interaction_id = repository
                      .create_interaction(&project, block, "Controller Sequence")
                      .expect("interaction");
                  let diagrams = vec![
                      BehaviorDiagram {
                          id: uuid::Uuid::new_v4().to_string(),
                          name: "Controller States".into(),
                          owner_id: package.to_string(),
                          context_id: block.to_string(),
                          kind: BehaviorDiagramKind::StateMachine,
                          semantic_id: state_machine_id.to_string(),
                          state_nodes: Vec::new(),
                          lifelines: Vec::new(),
                      },
                      BehaviorDiagram {
                          id: uuid::Uuid::new_v4().to_string(),
                          name: "Controller Sequence".into(),
                          owner_id: package.to_string(),
                          context_id: block.to_string(),
                          kind: BehaviorDiagramKind::Sequence,
                          semantic_id: interaction_id.to_string(),
                          state_nodes: Vec::new(),
                          lifelines: Vec::new(),
                      },
                  ];

                  let path = std::env::temp_dir().join(format!(
                      "systems-modeler-behavior-round-trip-{}.smproj",
                      uuid::Uuid::new_v4()
                  ));
                  {
                      let mut database = ProjectDatabase::open(&path).expect("open database");
                      database.save_project(&project).expect("save project");
                      save_behavior_metadata(&mut database, &project, &repository, &diagrams)
                          .expect("save behavior metadata");
                  }
                  {
                      let database = ProjectDatabase::open(&path).expect("reopen database");
                      let restored_project = database.load_first_project().expect("load project");
                      let (restored_repository, restored_diagrams) =
                          load_behavior_metadata(&database, &restored_project)
                              .expect("load behavior metadata");
                      assert_eq!(restored_repository.state_machines.len(), 1);
                      assert_eq!(restored_repository.interactions.len(), 1);
                      assert_eq!(restored_diagrams.len(), 2);
                      assert!(restored_diagrams.iter().any(|diagram| {
                          diagram.kind == BehaviorDiagramKind::StateMachine
                              && diagram.semantic_id == state_machine_id.to_string()
                      }));
                      assert!(restored_diagrams.iter().any(|diagram| {
                          diagram.kind == BehaviorDiagramKind::Sequence
                              && diagram.semantic_id == interaction_id.to_string()
                      }));
                  }
                  let _ = std::fs::remove_file(path);
              }
          }
          '''
          p.write_text(s)

          # CI contract: Open must not bypass unified refresh; workspace snapshot must include behavior.
          p = Path('scripts/validate_behavior_integration.py')
          s = p.read_text()
          insert = '''
          require(
              "apps/desktop/src-tauri/src/workspace.rs",
              "pub behavior_repository: BehaviorRepository",
              "pub behavior_diagrams: Vec<behavior_workspace::BehaviorDiagram>",
              "behavior_repository: behavior_repository.clone()",
              "behavior_diagrams: behavior_diagrams.clone()",
          )
          require(
              "apps/desktop/frontend/behavior-ui.js",
              "syncBehaviorSnapshotFromWorkspace",
              "state.snapshot.behavior_repository",
              "state.snapshot.behavior_diagrams",
          )
          app_payload = text("apps/desktop/frontend/app.js")
          open_section = app_payload.split("async function openProject()", 1)[1].split("async function saveProjectAs()", 1)[0]
          if "await refresh();" not in open_section:
              raise SystemExit("apps/desktop/frontend/app.js: Open must use unified refresh()")
          if "state.snapshot = await requireInvoke()('workspace_snapshot')" in open_section:
              raise SystemExit("apps/desktop/frontend/app.js: Open must not bypass unified refresh()")
          require(
              "apps/desktop/src-tauri/src/workspace/behavior_workspace.rs",
              "behavior_metadata_database_round_trip_preserves_stm_and_seq_diagrams",
          )

          '''
          anchor = 'print("PR12 consolidated Rust-authoritative behavior integration is complete")'
          if anchor not in s: raise SystemExit('validator print anchor missing')
          p.write_text(s.replace(anchor, insert + anchor))

          # Windows CI executes desktop unit tests so persistence regressions are real gates.
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = '''      - name: Desktop lint
                run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings'''
          new = '''      - name: Desktop tests
                run: cargo test -p systems-modeler-desktop
              - name: Desktop lint
                run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings'''
          if old not in s: raise SystemExit('CI desktop lint anchor missing')
          p.write_text(s.replace(old, new))
      - name: Format
        run: cargo fmt --all
      - name: Validate portable gates
        run: |
          node --check apps/desktop/frontend/app.js
          node --check apps/desktop/frontend/behavior-ui.js
          node --check apps/desktop/frontend/behavior-command-authority.js
          python scripts/validate_behavior_integration.py
          cargo test --workspace --exclude systems-modeler-desktop
      - name: Commit verified source repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/desktop/src-tauri/src/workspace.rs \
            apps/desktop/src-tauri/src/workspace/behavior_workspace.rs \
            apps/desktop/frontend/app.js \
            apps/desktop/frontend/behavior-ui.js \
            apps/desktop/frontend/behavior-command-authority.js \
            scripts/validate_behavior_integration.py \
            .github/workflows/ci.yml
          git commit -m "Unify project snapshots and qualify behavior save-open persistence"
          git push
