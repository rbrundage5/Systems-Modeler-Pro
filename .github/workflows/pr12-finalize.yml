name: pr12-finalize

on:
  push:
    branches:
      - agent/pr12-state-sequence-rust

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr12-state-sequence-rust
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final PR12 parity patch
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          workspace = 'apps/desktop/src-tauri/src/workspace/behavior_workspace.rs'
          patch(
              workspace,
              '''#[derive(Debug, Clone, Serialize, Deserialize)]
          pub struct LifelinePresentation {
              pub lifeline_id: String,
              pub x: f64,
          }''',
              '''fn default_lifeline_timeline_start_y() -> f64 {
              102.0
          }

          fn default_lifeline_timeline_end_y() -> f64 {
              840.0
          }

          #[derive(Debug, Clone, Serialize, Deserialize)]
          pub struct LifelinePresentation {
              pub lifeline_id: String,
              pub x: f64,
              #[serde(default = "default_lifeline_timeline_start_y")]
              pub timeline_start_y: f64,
              #[serde(default = "default_lifeline_timeline_end_y")]
              pub timeline_end_y: f64,
          }'''
          )
          patch(
              workspace,
              '''    diagram.lifelines.push(LifelinePresentation {
                  lifeline_id: id.to_string(),
                  x,
              });''',
              '''    diagram.lifelines.push(LifelinePresentation {
                  lifeline_id: id.to_string(),
                  x,
                  timeline_start_y: default_lifeline_timeline_start_y(),
                  timeline_end_y: default_lifeline_timeline_end_y(),
              });'''
          )
          patch(
              workspace,
              '''#[tauri::command]
          #[allow(clippy::too_many_arguments)] // Stable named-field Tauri IPC boundary.
          pub fn add_sequence_message(''',
              '''#[tauri::command]
          pub fn resize_sequence_lifeline_timeline(
              diagram_id: String,
              lifeline_id_value: String,
              timeline_start_y: f64,
              timeline_end_y: f64,
              state: tauri::State<'_, WorkspaceState>,
          ) -> Result<(), String> {
              if !timeline_start_y.is_finite() || !timeline_end_y.is_finite() {
                  return Err("Lifeline timeline coordinates must be finite".into());
              }
              if timeline_start_y < 90.0 {
                  return Err("Lifeline timeline must start below its header".into());
              }
              if timeline_end_y - timeline_start_y < 80.0 {
                  return Err("Lifeline timeline must be at least 80 diagram units long".into());
              }
              let mut diagrams = state
                  .behavior_diagrams
                  .lock()
                  .map_err(|_| "behavior diagram lock poisoned")?;
              let diagram = diagrams
                  .iter_mut()
                  .find(|diagram| diagram.id == diagram_id)
                  .ok_or("behavior diagram not found")?;
              if diagram.kind != BehaviorDiagramKind::Sequence {
                  return Err("active behavior diagram is not a Sequence Diagram".into());
              }
              let presentation = diagram
                  .lifelines
                  .iter_mut()
                  .find(|item| item.lifeline_id == lifeline_id_value)
                  .ok_or("Lifeline presentation not found")?;
              presentation.timeline_start_y = timeline_start_y;
              presentation.timeline_end_y = timeline_end_y;
              Ok(())
          }

          #[tauri::command]
          #[allow(clippy::too_many_arguments)] // Stable named-field Tauri IPC boundary.
          pub fn add_sequence_message('''
          )
          patch(
              workspace,
              '''                if !repository.interactions.contains_key(&id) {
                      return Err(format!(
                          "Interaction semantic object missing for diagram {}",
                          diagram.name
                      ));
                  }
              }
          }''',
              '''                let interaction = repository.interactions.get(&id).ok_or_else(|| {
                      format!("Interaction semantic object missing for diagram {}", diagram.name)
                  })?;
                  for presentation in &diagram.lifelines {
                      let semantic_id = lifeline_id(&presentation.lifeline_id)?;
                      if !interaction.lifelines.iter().any(|lifeline| lifeline.id == semantic_id) {
                          return Err(format!(
                              "Lifeline presentation {} has no semantic Lifeline in diagram {}",
                              presentation.lifeline_id, diagram.name
                          ));
                      }
                      if !presentation.x.is_finite()
                          || !presentation.timeline_start_y.is_finite()
                          || !presentation.timeline_end_y.is_finite()
                      {
                          return Err(format!(
                              "Lifeline presentation {} contains non-finite geometry",
                              presentation.lifeline_id
                          ));
                      }
                      if presentation.timeline_start_y < 90.0
                          || presentation.timeline_end_y - presentation.timeline_start_y < 80.0
                      {
                          return Err(format!(
                              "Lifeline presentation {} contains invalid timeline geometry",
                              presentation.lifeline_id
                          ));
                      }
                  }
              }
          }'''
          )
          with Path(workspace).open('a', encoding='utf-8') as f:
              f.write('''

          #[cfg(test)]
          mod presentation_tests {
              use super::{
                  LifelinePresentation, default_lifeline_timeline_end_y,
                  default_lifeline_timeline_start_y,
              };

              #[test]
              fn legacy_lifeline_presentation_receives_safe_timeline_defaults() {
                  let presentation: LifelinePresentation = serde_json::from_str(
                      r#"{"lifeline_id":"legacy-lifeline","x":240.0}"#,
                  )
                  .expect("legacy presentation should deserialize");
                  assert_eq!(presentation.timeline_start_y, default_lifeline_timeline_start_y());
                  assert_eq!(presentation.timeline_end_y, default_lifeline_timeline_end_y());
                  assert!(presentation.timeline_end_y - presentation.timeline_start_y >= 80.0);
              }
          }
          ''')

          main = 'apps/desktop/src-tauri/src/main.rs'
          patch(
              main,
              '''        create_state_machine_diagram, move_sequence_lifeline, move_state_vertex,
                  update_state_behaviors,''',
              '''        create_state_machine_diagram, move_sequence_lifeline, move_state_vertex,
                  resize_sequence_lifeline_timeline, update_state_behaviors,'''
          )
          patch(
              main,
              '''    ibd_item_flow_notation, move_sequence_lifeline, move_state_vertex, new_project,''',
              '''    ibd_item_flow_notation, move_sequence_lifeline, move_state_vertex,
                  resize_sequence_lifeline_timeline, new_project,'''
          )
          patch(
              main,
              '''            move_sequence_lifeline,
                      add_sequence_message,''',
              '''            move_sequence_lifeline,
                      resize_sequence_lifeline_timeline,
                      add_sequence_message,'''
          )

          renderer = 'apps/desktop/frontend/behavior-authoritative-renderer.js'
          patch(
              renderer,
              '''  function lifelinePresentation(diagram, id, index) {
              return diagram.lifelines?.find((item) => String(item.lifeline_id) === String(id)) || { x: 150 + index * 210, fallback: true };
            }''',
              '''  function lifelinePresentation(diagram, id, index) {
              return diagram.lifelines?.find((item) => String(item.lifeline_id) === String(id)) || {
                x: 150 + index * 210,
                timeline_start_y: 102,
                timeline_end_y: 840,
                fallback: true,
              };
            }'''
          )
          patch(
              renderer,
              '''      node.dataset.lifelineId = String(lifeline.id);
                  node.style.left = `${presentation.x - 65}px`;
                  node.innerHTML = `<div class="lifeline-head">${escapeHtml(lifeline.name || 'Lifeline')}</div><div class="lifeline-line"></div>`;''',
              '''      node.dataset.lifelineId = String(lifeline.id);
                  const timelineStart = Number.isFinite(presentation.timeline_start_y) ? presentation.timeline_start_y : 102;
                  const timelineEnd = Number.isFinite(presentation.timeline_end_y) ? presentation.timeline_end_y : 840;
                  node.style.left = `${presentation.x - 65}px`;
                  node.style.height = `${Math.max(120, timelineEnd - 60)}px`;
                  node.innerHTML = `<div class="lifeline-head">${escapeHtml(lifeline.name || 'Lifeline')}</div><div class="lifeline-line"></div><span class="lifeline-resize-handle" title="Resize Lifeline timeline" aria-label="Resize Lifeline timeline"></span>`;
                  const timeline = node.querySelector('.lifeline-line');
                  timeline.style.top = `${Math.max(42, timelineStart - 60)}px`;
                  timeline.style.bottom = 'auto';
                  timeline.style.height = `${Math.max(80, timelineEnd - timelineStart)}px`;
                  const timelineResize = node.querySelector('.lifeline-resize-handle');
                  timelineResize.style.top = `${Math.max(50, timelineEnd - 66)}px`;'''
          )
          patch(
              renderer,
              '''      if (!presentation.fallback) {
                  node.onpointerdown = (event) => {
                    if (state.behaviorPending || state.behaviorTool) return;''',
              '''      if (!presentation.fallback) {
                  timelineResize.onpointerdown = (event) => {
                    if (state.behaviorPending || state.behaviorTool) return;
                    event.preventDefault();
                    event.stopPropagation();
                    const startY = event.clientY;
                    const originalEnd = timelineEnd;
                    let nextEnd = originalEnd;
                    timelineResize.setPointerCapture?.(event.pointerId);
                    timelineResize.onpointermove = (move) => {
                      nextEnd = Math.max(timelineStart + 80, originalEnd + move.clientY - startY);
                      timeline.style.height = `${nextEnd - timelineStart}px`;
                      node.style.height = `${Math.max(120, nextEnd - 60)}px`;
                      timelineResize.style.top = `${Math.max(50, nextEnd - 66)}px`;
                    };
                    timelineResize.onpointerup = async () => {
                      timelineResize.onpointermove = null;
                      timelineResize.onpointerup = null;
                      await runCommand('Resizing Lifeline timeline…', () => requireInvoke()('resize_sequence_lifeline_timeline', {
                        diagramId: diagram.id,
                        lifelineIdValue: String(lifeline.id),
                        timelineStartY: timelineStart,
                        timelineEndY: nextEnd,
                      }));
                      await refresh();
                    };
                  };
                  node.onpointerdown = (event) => {
                    if (event.target.closest?.('.lifeline-resize-handle')) return;
                    if (state.behaviorPending || state.behaviorTool) return;'''
          )

          css = Path('apps/desktop/frontend/behavior.css')
          css.write_text(css.read_text(encoding='utf-8') + '.lifeline-resize-handle{position:absolute;left:56px;width:17px;height:11px;border:1px solid #555;border-radius:2px;background:#fff;cursor:ns-resize;z-index:8;box-sizing:border-box}.sequence-lifeline.selected .lifeline-resize-handle{border-width:2px}.execution-spec.selected,.combined-fragment.selected,.state-invariant-box.selected{outline:3px solid #4a79b8;outline-offset:2px}\n', encoding='utf-8')

          contract = 'scripts/validate_behavior_integration.py'
          patch(
              contract,
              '''    "move_sequence_lifeline",
              "add_sequence_message",''',
              '''    "move_sequence_lifeline",
              "resize_sequence_lifeline_timeline",
              "add_sequence_message",'''
          )
          patch(
              contract,
              '''    "move_sequence_lifeline",
              "Reply",''',
              '''    "move_sequence_lifeline",
              "resize_sequence_lifeline_timeline",
              "lifeline-resize-handle",
              "timeline_start_y",
              "timeline_end_y",
              "Reply",'''
          )
          require_test = '''\nrequire(\n    "apps/desktop/src-tauri/src/workspace/behavior_workspace.rs",\n    "default_lifeline_timeline_start_y",\n    "default_lifeline_timeline_end_y",\n    "resize_sequence_lifeline_timeline",\n    "legacy_lifeline_presentation_receives_safe_timeline_defaults",\n)\n'''
          cp = Path(contract)
          text = cp.read_text(encoding='utf-8')
          anchor = '\nprint("PR12 consolidated Rust-authoritative behavior integration is complete")'
          if anchor not in text:
              raise SystemExit('integration contract final anchor missing')
          cp.write_text(text.replace(anchor, require_test + anchor, 1), encoding='utf-8')
      - name: Format and verify patch
        run: |
          cargo fmt --all
          node --check apps/desktop/frontend/behavior-authoritative-renderer.js
          python scripts/validate_behavior_integration.py
          cargo test --workspace --exclude systems-modeler-desktop
          cargo check -p systems-modeler-desktop
          cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Commit final PR12 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr12-finalize.yml
          git add apps/desktop/src-tauri/src/workspace/behavior_workspace.rs apps/desktop/src-tauri/src/main.rs apps/desktop/frontend/behavior-authoritative-renderer.js apps/desktop/frontend/behavior.css scripts/validate_behavior_integration.py
          git commit -m "fix(pr12): persist and resize lifeline timelines"
          git push origin HEAD:agent/pr12-state-sequence-rust
