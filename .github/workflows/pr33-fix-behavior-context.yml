name: PR33 behavior context repair

on:
  push:
    branches:
      - agent/pr33-structural-runtime

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr33-structural-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply context and frame repair
        run: python .github/scripts/pr33_fix_behavior_context.py
      - name: Qualify repair
        run: |
          node --check apps/desktop/frontend/activity-ui.js
          node --check apps/desktop/frontend/behavior-ui.js
          node --check apps/desktop/frontend/behavior-ribbon.js
          node --check apps/desktop/frontend/shared-workspace.js
          cargo fmt --all --check
          cargo test -p systems-modeler-core
          python scripts/validate_activity_integration.py
          python scripts/validate_behavior_integration.py
          python scripts/validate_state_machine_execution.py
          python scripts/validate_structural_runtime_integration.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_rust_authority.py
      - name: Publish repair when needed
        run: |
          git add apps/desktop/frontend/activity-ui.js apps/desktop/frontend/behavior-ui.js apps/desktop/frontend/behavior-ribbon.js apps/desktop/frontend/shared-workspace.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR33: preserve behavior semantic context in shared frames'
          git push origin HEAD:agent/pr33-structural-runtime
