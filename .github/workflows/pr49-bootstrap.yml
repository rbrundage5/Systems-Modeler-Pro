name: pr49-bootstrap

on:
  push:
    branches: [agent/pr49-sequence-parametric-import]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr49-sequence-parametric-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Core check
        run: cargo check --workspace --exclude systems-modeler-desktop

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr49-sequence-parametric-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Desktop check with compiler diagnostic capture
        shell: pwsh
        run: |
          cmd /c "cargo check -p systems-modeler-desktop > pr49-desktop-check.log 2>&1"
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Select-String -Path pr49-desktop-check.log -Pattern 'error\[E[0-9]+\]:','error:','could not compile' -Context 10,10 | Out-File -Encoding utf8 pr49-desktop-errors.log
            Get-Content pr49-desktop-errors.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pr49-desktop-errors.log
            git commit -m "PR49: capture Windows desktop compiler errors"
            git push origin HEAD:agent/pr49-sequence-parametric-import
            exit $status
          }

