name: pr49-bootstrap

on:
  push:
    branches: [agent/pr49-sequence-parametric-import]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr49-sequence-parametric-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "PR49: apply rustfmt"
            git push origin HEAD:agent/pr49-sequence-parametric-import
          fi
      - name: Format check
        run: cargo fmt --all --check
      - name: Core check
        run: cargo check --workspace --exclude systems-modeler-desktop
      - name: Desktop check
        run: cargo check -p systems-modeler-desktop

