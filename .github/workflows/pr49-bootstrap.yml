name: pr49-bootstrap

on:
  push:
    branches:
      - agent/pr49-sequence-parametric-import

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr49-sequence-parametric-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply narrow PR49 fix
        run: python scripts/pr49_fix_signature.py
      - name: Format
        run: cargo fmt --all
      - name: Remove temporary logs
        run: rm -f pr49-desktop-check.log pr49-desktop-errors.log
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "PR49: fix message signature comparison"
            git push origin HEAD:agent/pr49-sequence-parametric-import
          fi

  desktop:
    runs-on: windows-latest
    needs: fix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr49-sequence-parametric-import
      - uses: dtolnay/rust-toolchain@stable
      - name: Desktop check
        run: cargo check -p systems-modeler-desktop

