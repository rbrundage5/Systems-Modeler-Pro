name: PR34 Reception Signal typing repair v2

on:
  push:
    branches:
      - agent/pr34-operation-signal-sequence-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr34-operation-signal-sequence-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and qualify Reception Signal typing repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch anchor not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Rust metamodel: Reception.signal is a modeled Signal, never an arbitrary classifier.
          replace_once(
              'crates/model-core/src/model.rs',
              '        ElementKind::Parameter | ElementKind::InstanceSpecification => any_classifier,\n        _ => true,',
              '        ElementKind::Parameter | ElementKind::InstanceSpecification => any_classifier,\n        ElementKind::Reception => matches!(type_kind, ElementKind::Signal),\n        _ => true,',
          )

          # Creation path: require and persist the accepted Signal type for new Receptions.
          replace_once(
              'apps/desktop/src-tauri/src/workspace/bdd_elements.rs',
              '        ElementKind::EnumerationLiteral\n        | ElementKind::Slot\n        | ElementKind::Operation\n        | ElementKind::Reception => project\n            .create_element(kind, name, owner_id)\n            .map_err(|error| error.to_string())?,\n        ElementKind::PartProperty',
              '        ElementKind::EnumerationLiteral | ElementKind::Slot | ElementKind::Operation => project\n            .create_element(kind, name, owner_id)\n            .map_err(|error| error.to_string())?,\n        ElementKind::Reception => {\n            let type_id = type_id.ok_or_else(|| {\n                "Reception requires a modeled Signal stable type ID".to_string()\n            })?;\n            let id = project\n                .create_element(ElementKind::Reception, name, owner_id)\n                .map_err(|error| error.to_string())?;\n            project\n                .set_element_type(id, parse_element_id(&type_id)?)\n                .map_err(|error| error.to_string())?;\n            id\n        }\n        ElementKind::PartProperty',
          )

          # Repair/edit path for existing untyped Receptions.
          replace_once(
              'apps/desktop/src-tauri/src/workspace/bdd_elements.rs',
              "    unit_external_id: Option<String>,\n    state: tauri::State<'_, WorkspaceState>,",
              "    unit_external_id: Option<String>,\n    type_id: Option<String>,\n    state: tauri::State<'_, WorkspaceState>,",
          )
          p = Path('apps/desktop/src-tauri/src/workspace/bdd_elements.rs')
          text = p.read_text(encoding='utf-8')
          function_start = text.index('pub fn update_bdd_element_details(')
          anchor = '    let project = project_guard.as_mut().ok_or("no project open")?;\n'
          pos = text.index(anchor, function_start) + len(anchor)
          insert = '''    if let Some(type_id) = type_id {\n        project\n            .set_element_type(element_id, parse_element_id(&type_id)?)\n            .map_err(|error| error.to_string())?;\n    }\n'''
          text = text[:pos] + insert + text[pos:]
          p.write_text(text, encoding='utf-8')

          # Creation UI: Reception selects a real modeled Signal, without adding property multiplicity semantics.
          replace_once(
              'apps/desktop/frontend/bdd-completion-ui.js',
              "    Parameter: ['Block', 'InterfaceBlock', 'ValueType', 'DataType', 'Enumeration'],\n    ConstraintParameter: ['ValueType', 'DataType', 'PrimitiveType', 'Enumeration'],",
              "    Parameter: ['Block', 'InterfaceBlock', 'ValueType', 'DataType', 'Enumeration'],\n    Reception: ['Signal'],\n    ConstraintParameter: ['ValueType', 'DataType', 'PrimitiveType', 'Enumeration'],",
          )
          replace_once(
              'apps/desktop/frontend/bdd-completion-ui.js',
              "  const typeId = BDD_TYPED_FEATURE_KINDS.has(semanticKind) ? await chooseTypeId(semanticKind) : null;\n  if (BDD_TYPED_FEATURE_KINDS.has(semanticKind) && !typeId) return;",
              "  const needsType = BDD_TYPED_FEATURE_KINDS.has(semanticKind) || semanticKind === 'Reception';\n  const typeId = needsType ? await chooseTypeId(semanticKind) : null;\n  if (needsType && !typeId) return;",
          )

          # The final property editor layer owns the visible repair control.
          replace_once(
              'apps/desktop/frontend/bdd-feature-editing.js',
              "    const isFlowProperty = element.kind === 'FlowProperty';\n    const quantityKinds = project.elements.filter((candidate) => candidate.kind === 'QuantityKind');",
              "    const isFlowProperty = element.kind === 'FlowProperty';\n    const isReception = element.kind === 'Reception';\n    const signals = project.elements.filter((candidate) => candidate.kind === 'Signal');\n    const quantityKinds = project.elements.filter((candidate) => candidate.kind === 'QuantityKind');",
          )
          replace_once(
              'apps/desktop/frontend/bdd-feature-editing.js',
              "      ${element.type_id ? `<label>Type<input value=\"${escapeAttr(typeName(project, element))}\" disabled></label>` : ''}\n      ${supportsMultiplicity ?",
              "      ${element.type_id ? `<label>Type<input value=\"${escapeAttr(typeName(project, element))}\" disabled></label>` : ''}\n      ${isReception ? `<label>Accepted Signal<select id=\"property-reception-signal\"><option value=\"\">Select Signal</option>${signals.map((candidate) => `<option value=\"${escapeAttr(candidate.id)}\" ${String(candidate.id) === String(element.type_id || '') ? 'selected' : ''}>${escapeHtml(candidate.name)}</option>`).join('')}</select></label>` : ''}\n      ${supportsMultiplicity ?",
          )
          replace_once(
              'apps/desktop/frontend/bdd-feature-editing.js',
              "      const flowDirection = isFlowProperty ? $('property-flow-direction').value : null;\n\n      if (name !== element.name) {",
              "      const flowDirection = isFlowProperty ? $('property-flow-direction').value : null;\n      const typeId = isReception ? ($('property-reception-signal')?.value || null) : null;\n\n      if (name !== element.name) {",
          )
          replace_once(
              'apps/desktop/frontend/bdd-feature-editing.js',
              '        quantityKindExternalId,\n        unitExternalId,\n      }));',
              '        quantityKindExternalId,\n        unitExternalId,\n        typeId,\n      }));',
          )

          # Core regression: wrong classifier type is rejected; Signal type is accepted.
          test = Path('crates/model-core/tests/pr34_operation_signal_sequence.rs')
          text = test.read_text(encoding='utf-8')
          if 'fn reception_type_is_restricted_to_modeled_signal()' not in text:
              text += '''\n\n#[test]\nfn reception_type_is_restricted_to_modeled_signal() {\n    let mut project = Project::new("Reception typing");\n    let package = project\n        .create_element(ElementKind::Package, "Pkg", project.root_id)\n        .unwrap();\n    let controller = project\n        .create_element(ElementKind::Block, "Controller", package)\n        .unwrap();\n    let wrong_type = project\n        .create_element(ElementKind::Block, "WrongType", package)\n        .unwrap();\n    let start = project\n        .create_element(ElementKind::Signal, "Start", package)\n        .unwrap();\n    let reception = project\n        .create_element(ElementKind::Reception, "receiveStart", controller)\n        .unwrap();\n\n    assert!(project.set_element_type(reception, wrong_type).is_err());\n    project.set_element_type(reception, start).unwrap();\n    assert_eq!(project.element(reception).unwrap().type_id, Some(start));\n}\n'''
              test.write_text(text, encoding='utf-8')

          # Permanent integration guard for the desktop authoring path that manual testing exposed.
          validator = Path('scripts/validate_operation_signal_sequence_integration.py')
          text = validator.read_text(encoding='utf-8')
          text = text.replace(
              'editing = read("scripts/validate_standard_editing_integration.py")\n',
              'editing = read("scripts/validate_standard_editing_integration.py")\nbdd_completion = read("apps/desktop/frontend/bdd-completion-ui.js")\nbdd_features = read("apps/desktop/frontend/bdd-feature-editing.js")\nbdd_commands = read("apps/desktop/src-tauri/src/workspace/bdd_elements.rs")\nmodel = read("crates/model-core/src/model.rs")\n',
              1,
          )
          guard = '''\nfor token, source in [\n    ("Reception: ['Signal']", bdd_completion),\n    ("property-reception-signal", bdd_features),\n    ("Reception requires a modeled Signal stable type ID", bdd_commands),\n    ("ElementKind::Reception => matches!(type_kind, ElementKind::Signal)", model),\n    ("reception_type_is_restricted_to_modeled_signal", tests),\n]:\n    assert token in source, f"missing Reception/Signal authoring contract: {token}"\n\n'''
          print_anchor = 'print(\n    "PR34 Operation/Signal/Sequence integration contract passed:'
          if guard.strip() not in text:
              text = text.replace(print_anchor, guard + print_anchor, 1)
          validator.write_text(text, encoding='utf-8')
          PY

          cargo fmt --all
          node --check apps/desktop/frontend/bdd-completion-ui.js
          node --check apps/desktop/frontend/bdd-feature-editing.js
          cargo test -p systems-modeler-core --test pr34_operation_signal_sequence
          python scripts/validate_operation_signal_sequence_integration.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_rust_authority.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/model-core/src/model.rs apps/desktop/src-tauri/src/workspace/bdd_elements.rs apps/desktop/frontend/bdd-completion-ui.js apps/desktop/frontend/bdd-feature-editing.js crates/model-core/tests/pr34_operation_signal_sequence.rs scripts/validate_operation_signal_sequence_integration.py
          git rm -f .github/workflows/pr34-reception-typing-repair.yml .github/workflows/pr34-reception-typing-repair-v2.yml
          git commit -m "PR34: type Receptions by modeled Signals"
          git push origin HEAD:agent/pr34-operation-signal-sequence-runtime
