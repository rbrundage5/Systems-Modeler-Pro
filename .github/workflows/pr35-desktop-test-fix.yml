name: PR35 desktop adapter assertion fix

on:
  push:
    branches: [agent/pr35-native-parametric-runtime]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
      - name: Update Parametric runtime adapter assertion
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src-tauri/src/workspace/presentation_theme.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        assert_eq!(
            evaluation.command.rust_adapter,
            Some("evaluate_parametric_diagram")
        );'''
          new = '''        assert_eq!(
            evaluation.command.rust_adapter,
            Some("evaluate_parametric_execution")
        );'''
          if old not in text:
              raise SystemExit('stale Parametric adapter assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python scripts/validate_parametric_integration.py
          python scripts/validate_parametric_runtime_integration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/workspace/presentation_theme.rs
          git commit -m "PR35: update Parametric runtime adapter assertion"
          git push origin HEAD:agent/pr35-native-parametric-runtime
