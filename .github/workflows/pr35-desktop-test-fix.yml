name: PR35 desktop adapter assertion fix

on:
  push:
    branches:
      - agent/pr35-native-parametric-runtime

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
      - name: Update Parametric runtime adapter assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src-tauri/src/workspace/presentation_theme.rs")
          text = path.read_text(encoding="utf-8")
          old = 'Some("evaluate_parametric_diagram")'
          new = 'Some("evaluate_parametric_execution")'

          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Parametric adapter assertion target not found")
          PY

          git diff --check
          python scripts/validate_parametric_integration.py
          python scripts/validate_parametric_runtime_integration.py

          if git diff --quiet; then
            echo "Assertion already current; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/workspace/presentation_theme.rs
          git commit -m "PR35: update Parametric runtime adapter assertion"
          git push origin HEAD:agent/pr35-native-parametric-runtime
