name: PR51 bootstrap

on:
  push:
    branches:
      - agent/pr51-complete-groovy-automation

permissions:
  contents: write

jobs:
  repair-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr51-complete-groovy-automation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply narrow PR51 compiler repairs
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/desktop/src-tauri/src/workspace/model_script.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'use std::collections::{HashMap, HashSet};': 'use std::collections::HashSet;',
              'project.qualified_name(element.id).as_deref() == Some(qualified)': 'project.qualified_name(element.id).as_deref() == Ok(qualified)',
              'project.qualified_name(element.id).as_deref() == Some(qname)': 'project.qualified_name(element.id).as_deref() == Ok(qname)',
              'let presentation = |node_id| native.nodes.iter()': 'let presentation = |node_id: systems_modeler_core::ActivityNodeId| native.nodes.iter()',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No bootstrap changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/workspace/model_script.rs
          git commit -m 'PR51: repair and format model-script host'
          git push origin HEAD:agent/pr51-complete-groovy-automation
