name: PR51 finalize

on:
  push:
    branches:
      - agent/pr51-complete-groovy-automation

permissions:
  contents: write

jobs:
  finalize-pr51:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr51-complete-groovy-automation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply focused PR51 completion patch
        run: python scripts/pr51_finalize.py
      - name: Normalize final PR51 source and qualification coverage
        shell: python
        run: |
          from pathlib import Path

          rust = Path('apps/desktop/src-tauri/src/workspace/model_script.rs')
          text = rust.read_text(encoding='utf-8')

          lint = '#![allow(clippy::result_large_err)] // Serialized PR51 diagnostics intentionally retain rich context.\n\n'
          anchor = '//! mutation directly.\n\n'
          if lint not in text:
              if anchor not in text:
                  raise SystemExit('model-script module-doc anchor not found')
              text = text.replace(anchor, anchor + lint, 1)

          start = text.find('\nfn behavior_semantic_id(')
          if start >= 0:
              end = text.find('\nfn presentation_family(', start)
              if end < 0:
                  raise SystemExit('behavior_semantic_id end anchor not found')
              text = text[:start] + text[end:]
          text = text.replace(
              '    BehaviorSemanticId, InteractionOperator, MessageSort, PseudostateKind, TransitionKind,\n',
              '    InteractionOperator, MessageSort, PseudostateKind, TransitionKind,\n',
              1,
          )

          text = text.replace(
              '.children(scope)\n        .into_iter()\n        .filter(',
              '.children(scope)\n        .filter(',
          )

          marker = '// PR51_REPRESENTATIVE_QUALIFICATION'
          if marker not in text:
              raise SystemExit('representative qualification marker not found')
          head, tail = text.split(marker, 1)
          for old, new in [
              ('super::parse_element_id', 'super::super::parse_element_id'),
              ('super::portable_interchange', 'super::super::portable_interchange'),
              ('super::spreadsheet_interchange', 'super::super::spreadsheet_interchange'),
              ('super::BDD_METADATA_KEY', 'super::super::BDD_METADATA_KEY'),
              ('super::ibd::', 'super::super::ibd::'),
              ('super::behavior_workspace::', 'super::super::behavior_workspace::'),
              ('super::activity_workspace::', 'super::super::activity_workspace::'),
          ]:
              tail = tail.replace(old, new)
          rust.write_text(head + marker + tail, encoding='utf-8')

          model_script_ui = Path('apps/desktop/frontend/model-script-ui.js')
          ui_shell = Path('apps/desktop/frontend/ui-shell.js')
          adapter = model_script_ui.read_text(encoding='utf-8').strip()
          shell = ui_shell.read_text(encoding='utf-8')
          sentinel = '// PR51 model-script desktop adapter; semantic authority remains in Rust.'
          if sentinel not in shell:
              shell = shell.rstrip() + '\n\n' + sentinel + '\n' + adapter + '\n'
              ui_shell.write_text(shell, encoding='utf-8')
          model_script_ui.unlink()

          index = Path('apps/desktop/frontend/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('  <script src="model-script-ui.js"></script>\n', '')
          index.write_text(html, encoding='utf-8')
      - name: Format Rust
        run: cargo fmt --all
      - name: Frontend syntax and Rust-authority gate
        shell: pwsh
        run: |
          node --check apps/desktop/frontend/ui-shell.js
          python scripts/validate_rust_authority.py
      - name: Focused PR51 tests
        run: cargo test -p systems-modeler-desktop model_script::tests -- --nocapture
      - name: Focused PR51 Clippy
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Publish coherent PR51 branch and remove temporary machinery
        shell: pwsh
        run: |
          git rm .github/workflows/pr51-bootstrap.yml scripts/pr51_finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR51: complete and qualify Groovy model-script automation'
          git push origin HEAD:agent/pr51-complete-groovy-automation
