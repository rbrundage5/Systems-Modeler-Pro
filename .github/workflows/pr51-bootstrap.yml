name: PR51 finalize

on:
  push:
    branches:
      - agent/pr51-complete-groovy-automation

permissions:
  contents: write

jobs:
  finalize-pr51:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr51-complete-groovy-automation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply focused PR51 completion patch
        run: python scripts/pr51_finalize.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Focused PR51 tests
        run: cargo test -p systems-modeler-desktop model_script::tests -- --nocapture
      - name: Focused PR51 Clippy
        run: cargo clippy -p systems-modeler-desktop -- -D warnings
      - name: Publish coherent PR51 branch and remove temporary machinery
        shell: pwsh
        run: |
          git rm .github/workflows/pr51-bootstrap.yml scripts/pr51_finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/workspace/model_script.rs examples/model-script/vehicle-model.groovy
          git commit -m 'PR51: complete and qualify Groovy model-script automation'
          git push origin HEAD:agent/pr51-complete-groovy-automation
