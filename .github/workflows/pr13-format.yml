name: pr13-format

on:
  push:
    branches: [agent/pr13-activity-rust]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[pr13 fmt]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr13-activity-rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/model-core/src/activity.rs crates/model-core/tests/pr13_activity.rs
          git commit -m "Format PR13 activity core [pr13 fmt]"
          git push origin HEAD:agent/pr13-activity-rust
