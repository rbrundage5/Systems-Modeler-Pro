name: PR33 one-shot desktop runtime configuration

on:
  push:
    branches:
      - agent/pr33-structural-runtime

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr33-structural-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply desktop runtime configuration integration
        run: python .github/scripts/pr33_desktop_runtime_config.py
      - name: Format and qualify PR33 integration
        run: |
          cargo fmt --all
          cargo test -p systems-modeler-core --test pr33_structural_runtime
          cargo test -p systems-modeler-core
          cargo check -p systems-modeler-desktop
          cargo test -p systems-modeler-desktop
          cargo clippy -p systems-modeler-core --all-targets -- -D warnings
          cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
          node --check apps/desktop/frontend/behavior-authoritative-renderer.js
          node --check apps/desktop/frontend/activity-rich-ui.js
          python scripts/validate_structural_runtime_integration.py
          python scripts/validate_activity_integration.py
          python scripts/validate_state_machine_execution.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_rust_authority.py
      - name: Remove migration helpers and publish integration
        run: |
          rm .github/workflows/pr33-one-shot-desktop-config.yml
          rm .github/scripts/pr33_desktop_runtime_config.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR33: expose validated structural runtime configuration in desktop'
          git push origin HEAD:agent/pr33-structural-runtime
