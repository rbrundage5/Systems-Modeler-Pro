name: pr13-rustfmt-fix

on:
  push:
    branches:
      - agent/pr13-activity-rust

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr13-activity-rust
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: |
          cargo fmt --all
          rm .github/workflows/pr13-rustfmt-fix.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/src/workspace/activity_workspace.rs .github/workflows/pr13-rustfmt-fix.yml
          git commit -m "style: format Activity endpoint support"
          git push origin HEAD:agent/pr13-activity-rust
