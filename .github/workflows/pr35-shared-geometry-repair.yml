name: PR35 shared geometry repair

on:
  push:
    branches:
      - agent/pr35-native-parametric-runtime
    paths:
      - .github/workflows/pr35-shared-geometry-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/pr35_shared_geometry_repair.py

      - name: Align geometry contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_presentation_interaction.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'assert "(move.clientX - startX) / scale.x" in frontend\nassert "(move.clientY - startY) / scale.y" in frontend',
              'assert "(move.clientX - startX) / Math.max(scale.x || 1, 0.0001)" in frontend\nassert "(move.clientY - startY) / Math.max(scale.y || 1, 0.0001)" in frontend',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Frontend syntax
        run: |
          node --check apps/desktop/frontend/app.js
          node --check apps/desktop/frontend/diagram-interaction.js

      - name: Presentation contracts
        run: |
          python scripts/validate_presentation_interaction.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_parametric_runtime_integration.py

      - name: Diff check
        run: git diff --check

      - name: Publish repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr35-shared-geometry-repair.yml scripts/pr35_shared_geometry_repair.py
          git add apps/desktop/frontend/app.js \
                  apps/desktop/frontend/diagram-interaction.js \
                  apps/desktop/src-tauri/src/workspace/presentation_interaction.rs \
                  scripts/validate_presentation_interaction.py
          git commit -m "PR35: unify structural move and resize gestures"
          git push origin HEAD:agent/pr35-native-parametric-runtime
