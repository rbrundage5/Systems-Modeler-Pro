name: pr42-focused

on:
  push:
    branches: [agent/pr42-native-allocation-import]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr42-native-allocation-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply PR42 implementation
        run: python scripts/pr42_patch.py
      - name: Add PR42 focused tests and fixture
        run: python scripts/pr42_tests.py
      - name: Format
        run: cargo fmt --all
      - name: Check desktop
        run: cargo check -p systems-modeler-desktop
      - name: PR42 model-core tests
        run: cargo test -p systems-modeler-core --test pr42_allocation -- --nocapture
      - name: PR42 persistence test
        run: cargo test -p systems-modeler-persistence --test pr42_allocation_persistence -- --nocapture
      - name: PR42 desktop and spreadsheet tests
        run: cargo test -p systems-modeler-desktop pr42_ -- --nocapture
      - name: Desktop lint
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Core and persistence lint
        run: cargo clippy --workspace --exclude systems-modeler-desktop --all-targets -- -D warnings
      - name: Commit qualified PR42 result
        shell: pwsh
        run: |
          Remove-Item scripts/pr42_patch.py
          Remove-Item scripts/pr42_tests.py
          Remove-Item .github/workflows/pr42-focused.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR42: native allocation semantics and CATIA-style import"
          git push origin HEAD:agent/pr42-native-allocation-import
