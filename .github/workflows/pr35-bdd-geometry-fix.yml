name: PR35 BDD geometry regression fix

on:
  push:
    branches:
      - agent/pr35-native-parametric-runtime

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
      - name: Restore BDD move and resize interaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('apps/desktop/frontend/app.js')
          text = app.read_text(encoding='utf-8')
          anchor = "    box.dataset.semanticKind = element.kind;\n"
          replacement = anchor + "    box.dataset.presentationId = node.id;\n"
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('BDD presentation-id anchor not found in app.js')
              text = text.replace(anchor, replacement, 1)
              app.write_text(text, encoding='utf-8')

          interaction = Path('apps/desktop/frontend/diagram-interaction.js')
          text = interaction.read_text(encoding='utf-8')

          helper_anchor = "  window.smpCommitPresentationGeometry = commit;\n\n"
          helper = """  window.smpCommitPresentationGeometry = commit;\n\n  function surfaceScale(node) {\n    const surface = node.closest?.('.workspace-renderer-surface') || node.parentElement;\n    const rect = surface?.getBoundingClientRect?.();\n    const width = surface?.offsetWidth || rect?.width || 1;\n    const height = surface?.offsetHeight || rect?.height || 1;\n    const x = rect?.width && width ? rect.width / width : 1;\n    const y = rect?.height && height ? rect.height / height : 1;\n    return { x: Math.max(x || 1, 0.0001), y: Math.max(y || 1, 0.0001) };\n  }\n\n"""
          if 'function surfaceScale(node)' not in text:
              if helper_anchor not in text:
                  raise SystemExit('geometry helper anchor not found')
              text = text.replace(helper_anchor, helper, 1)

          move_anchor = """      const startX = event.clientX;\n      const startY = event.clientY;\n      const original = config.geometry();\n      let next = { ...original };\n"""
          move_replacement = """      const startX = event.clientX;\n      const startY = event.clientY;\n      const scale = surfaceScale(node);\n      const original = config.geometry();\n      let next = { ...original };\n"""
          if move_replacement not in text:
              if move_anchor not in text:
                  raise SystemExit('BDD move pointer anchor not found')
              text = text.replace(move_anchor, move_replacement, 1)

          text = text.replace(
              "        next.x = Math.max(0, original.x + move.clientX - startX);\n        next.y = Math.max(42, original.y + move.clientY - startY);",
              "        next.x = Math.max(0, original.x + (move.clientX - startX) / scale.x);\n        next.y = Math.max(42, original.y + (move.clientY - startY) / scale.y);",
              1,
          )

          resize_anchor = """      const startX = event.clientX;\n      const startY = event.clientY;\n      const original = config.geometry();\n      let next = { ...original };\n      handle.setPointerCapture?.(event.pointerId);\n"""
          resize_replacement = """      const startX = event.clientX;\n      const startY = event.clientY;\n      const scale = surfaceScale(node);\n      const original = config.geometry();\n      let next = { ...original };\n      handle.setPointerCapture?.(event.pointerId);\n"""
          if resize_replacement not in text:
              if resize_anchor not in text:
                  raise SystemExit('BDD resize pointer anchor not found')
              text = text.replace(resize_anchor, resize_replacement, 1)

          text = text.replace(
              "        next.width = Math.max(config.minWidth, original.width + move.clientX - startX);\n        next.height = Math.max(config.minHeight, original.height + move.clientY - startY);",
              "        next.width = Math.max(config.minWidth, original.width + (move.clientX - startX) / scale.x);\n        next.height = Math.max(config.minHeight, original.height + (move.clientY - startY) / scale.y);",
              1,
          )

          observer_anchor = """  queueMicrotask(install);\n})();\n"""
          observer_replacement = """  queueMicrotask(install);\n  const canvas = document.getElementById('canvas');\n  if (canvas) {\n    let installQueued = false;\n    new MutationObserver(() => {\n      if (installQueued) return;\n      installQueued = true;\n      queueMicrotask(() => {\n        installQueued = false;\n        install();\n      });\n    }).observe(canvas, { childList: true, subtree: true });\n  }\n})();\n"""
          if observer_replacement not in text:
              if observer_anchor not in text:
                  raise SystemExit('interaction rebind anchor not found')
              text = text.replace(observer_anchor, observer_replacement, 1)

          interaction.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate_presentation_interaction.py')
          text = validator.read_text(encoding='utf-8')
          if 'app_frontend = read("apps/desktop/frontend/app.js")' not in text:
              text = text.replace(
                  'frontend = read("apps/desktop/frontend/diagram-interaction.js")\n',
                  'frontend = read("apps/desktop/frontend/diagram-interaction.js")\napp_frontend = read("apps/desktop/frontend/app.js")\n',
                  1,
              )
          contract_anchor = 'assert "node.dataset.presentationId" in frontend\n'
          contract_addition = '''assert "node.dataset.presentationId" in frontend\nassert "box.dataset.presentationId = node.id" in app_frontend\nassert "function surfaceScale(node)" in frontend\nassert "(move.clientX - startX) / scale.x" in frontend\nassert "(move.clientY - startY) / scale.y" in frontend\nassert "new MutationObserver" in frontend\n'''
          if 'assert "box.dataset.presentationId = node.id" in app_frontend' not in text:
              if contract_anchor not in text:
                  raise SystemExit('presentation interaction validator anchor not found')
              text = text.replace(contract_anchor, contract_addition, 1)
          validator.write_text(text, encoding='utf-8')
          PY

          node --check apps/desktop/frontend/app.js
          node --check apps/desktop/frontend/diagram-interaction.js
          python scripts/validate_presentation_interaction.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_parametric_runtime_integration.py
          git diff --check

          if git diff --quiet; then
            echo "BDD geometry fix already present; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/frontend/app.js apps/desktop/frontend/diagram-interaction.js scripts/validate_presentation_interaction.py
          git commit -m "PR35: restore BDD move and resize interaction"
          git push origin HEAD:agent/pr35-native-parametric-runtime
