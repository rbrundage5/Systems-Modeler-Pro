name: pr12-integrate-behavior
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/pr12-state-sequence-rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr12-state-sequence-rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Wire behavior engine, persistence, Tauri commands, and frontend
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          replace('crates/model-core/src/lib.rs',
'''pub mod ibd;
pub use ibd::{Connector, ConnectorEnd, ConnectorKind, ItemFlow};''',
'''pub mod behavior;
pub mod ibd;
pub use behavior::*;
pub use ibd::{Connector, ConnectorEnd, ConnectorKind, ItemFlow};''')

          p=Path('apps/desktop/src-tauri/src/workspace.rs'); s=p.read_text()
          s=s.replace('''use systems_modeler_core::{
    AggregationKind, DiagramId, ElementId, ElementKind, Multiplicity, Project, Relationship,
    RelationshipId, RelationshipKind,
};''','''use systems_modeler_core::{
    AggregationKind, BehaviorRepository, DiagramId, ElementId, ElementKind, Multiplicity, Project,
    Relationship, RelationshipId, RelationshipKind,
};''',1)
          s=s.replace('''pub struct WorkspaceState {
    project: Mutex<Option<Project>>,
    diagrams: Mutex<Vec<BddDiagram>>,
    ibd_diagrams: Mutex<Vec<ibd::IbdDiagram>>,
    current_file: Mutex<Option<String>>,
}''','''pub struct WorkspaceState {
    project: Mutex<Option<Project>>,
    diagrams: Mutex<Vec<BddDiagram>>,
    ibd_diagrams: Mutex<Vec<ibd::IbdDiagram>>,
    behavior: Mutex<BehaviorRepository>,
    behavior_diagrams: Mutex<Vec<behavior_workspace::BehaviorDiagram>>,
    current_file: Mutex<Option<String>>,
}''',1)
          s=s.replace('''            project: Mutex::new(None),
            diagrams: Mutex::new(Vec::new()),
            ibd_diagrams: Mutex::new(Vec::new()),
            current_file: Mutex::new(None),''','''            project: Mutex::new(None),
            diagrams: Mutex::new(Vec::new()),
            ibd_diagrams: Mutex::new(Vec::new()),
            behavior: Mutex::new(BehaviorRepository::default()),
            behavior_diagrams: Mutex::new(Vec::new()),
            current_file: Mutex::new(None),''',1)
          s=s.replace('''    state.diagrams.lock().map_err(|_| "diagram lock poisoned")?.clear();
    state.ibd_diagrams.lock().map_err(|_| "IBD lock poisoned")?.clear();
    *state.current_file.lock().map_err(|_| "project path lock poisoned")? = None;''','''    state.diagrams.lock().map_err(|_| "diagram lock poisoned")?.clear();
    state.ibd_diagrams.lock().map_err(|_| "IBD lock poisoned")?.clear();
    *state.behavior.lock().map_err(|_| "behavior lock poisoned")? = BehaviorRepository::default();
    state.behavior_diagrams.lock().map_err(|_| "behavior diagram lock poisoned")?.clear();
    *state.current_file.lock().map_err(|_| "project path lock poisoned")? = None;''',1)
          old='''    ibd::save_ibd_metadata(&mut database, project, &ibd_diagrams)?;
    let saved_path = path.to_string_lossy().into_owned();'''
          new='''    ibd::save_ibd_metadata(&mut database, project, &ibd_diagrams)?;
    let behavior = state.behavior.lock().map_err(|_| "behavior lock poisoned")?;
    let behavior_diagrams = state.behavior_diagrams.lock().map_err(|_| "behavior diagram lock poisoned")?;
    behavior_workspace::save_behavior_metadata(&mut database, project, &behavior, &behavior_diagrams)?;
    let saved_path = path.to_string_lossy().into_owned();'''
          if old not in s: raise SystemExit('save behavior anchor missing')
          s=s.replace(old,new,1)
          old='''    let ibd_diagrams = ibd::load_ibd_metadata(&database, &project)?;
    let opened_path = path.to_string_lossy().into_owned();'''
          new='''    let ibd_diagrams = ibd::load_ibd_metadata(&database, &project)?;
    let (behavior, behavior_diagrams) = behavior_workspace::load_behavior_metadata(&database, &project)?;
    let opened_path = path.to_string_lossy().into_owned();'''
          if old not in s: raise SystemExit('open behavior anchor missing')
          s=s.replace(old,new,1)
          old='''    *state.ibd_diagrams.lock().map_err(|_| "IBD lock poisoned")? = ibd_diagrams;
    *state.current_file.lock().map_err(|_| "project path lock poisoned")? = Some(opened_path.clone());'''
          new='''    *state.ibd_diagrams.lock().map_err(|_| "IBD lock poisoned")? = ibd_diagrams;
    *state.behavior.lock().map_err(|_| "behavior lock poisoned")? = behavior;
    *state.behavior_diagrams.lock().map_err(|_| "behavior diagram lock poisoned")? = behavior_diagrams;
    *state.current_file.lock().map_err(|_| "project path lock poisoned")? = Some(opened_path.clone());'''
          if old not in s: raise SystemExit('assign behavior anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('apps/desktop/src-tauri/src/main.rs'); s=p.read_text()
          s=s.replace('''    mod bdd_elements;
    mod feature_editing;''','''    mod bdd_elements;
    mod behavior_workspace;
    mod feature_editing;''',1)
          anchor='''    pub use bdd_elements::{
        create_bdd_element, create_bdd_feature, create_bdd_relationship_complete,
        open_project_file_complete, place_bdd_element, save_current_project_complete,
        save_project_file_complete, update_bdd_element_details, workspace_snapshot_complete,
    };'''
          addition=anchor+'''\n    pub use behavior_workspace::{
        add_combined_fragment, add_execution_specification, add_sequence_lifeline,
        add_sequence_message, add_state_invariant, add_state_region, add_state_transition,
        add_state_vertex, behavior_lifeline_candidates, behavior_snapshot,
        create_sequence_diagram, create_state_machine_diagram, move_sequence_lifeline,
        move_state_vertex, update_state_behaviors,
    };'''
          if anchor not in s: raise SystemExit('main behavior export anchor missing')
          s=s.replace(anchor,addition,1)
          old='''use workspace::{
    WorkspaceState, add_item_flow_to_connector, add_nested_port_to_ibd, create_bdd,'''
          new='''use workspace::{
    WorkspaceState, add_combined_fragment, add_execution_specification, add_item_flow_to_connector,
    add_nested_port_to_ibd, add_sequence_lifeline, add_sequence_message, add_state_invariant,
    add_state_region, add_state_transition, add_state_vertex, behavior_lifeline_candidates,
    behavior_snapshot, create_bdd,'''
          if old not in s: raise SystemExit('main use anchor missing')
          s=s.replace(old,new,1)
          old='''    create_package, delete_bdd_relationship, ibd_item_flow_notation, new_project,'''
          new='''    create_package, create_sequence_diagram, create_state_machine_diagram,
    delete_bdd_relationship, ibd_item_flow_notation, move_sequence_lifeline, move_state_vertex,
    new_project,'''
          if old not in s: raise SystemExit('main use create anchor missing')
          s=s.replace(old,new,1)
          old='''    save_project_file_complete, update_association_end, update_bdd_element_details,
    update_bdd_feature_semantics, workspace_snapshot, workspace_snapshot_complete,'''
          new='''    save_project_file_complete, update_association_end, update_bdd_element_details,
    update_bdd_feature_semantics, update_state_behaviors, workspace_snapshot,
    workspace_snapshot_complete,'''
          if old not in s: raise SystemExit('main use update anchor missing')
          s=s.replace(old,new,1)
          old='''            route_ibd,
            place_element_on_bdd,'''
          new='''            route_ibd,
            behavior_snapshot,
            create_state_machine_diagram,
            create_sequence_diagram,
            add_state_vertex,
            add_state_region,
            update_state_behaviors,
            add_state_transition,
            move_state_vertex,
            behavior_lifeline_candidates,
            add_sequence_lifeline,
            move_sequence_lifeline,
            add_sequence_message,
            add_execution_specification,
            add_combined_fragment,
            add_state_invariant,
            place_element_on_bdd,'''
          if old not in s: raise SystemExit('handler anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('apps/desktop/frontend/index.html'); s=p.read_text()
          s=s.replace('''  <link rel="stylesheet" href="ibd.css" />''','''  <link rel="stylesheet" href="ibd.css" />
  <link rel="stylesheet" href="behavior.css" />''',1)
          s=s.replace('''<script src="item-flow-ui.js"></script><script src="ui-shell.js"></script>''','''<script src="item-flow-ui.js"></script><script src="behavior-ui.js"></script><script src="ui-shell.js"></script>''',1)
          p.write_text(s)

          for name in ['.github/workflows/pr11-dedupe-itemflows.yml','.github/workflows/pr12-bootstrap.yml','.github/workflows/pr12-fix-clippy.yml','.github/workflows/pr12-integrate-behavior.yml']:
              q=Path(name)
              if q.exists(): q.unlink()
      - name: Qualify Rust and desktop
        run: |
          cargo fmt --all
          cargo test -p systems-modeler-core
          cargo clippy -p systems-modeler-core -- -D warnings
          cargo check -p systems-modeler-desktop
          git diff --exit-code Cargo.lock
      - name: Commit integrated PR12 product
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate native State Machine and Sequence modeling"
          git push
