name: PR34 Reception Signal typing repair

on:
  push:
    branches:
      - agent/pr34-operation-signal-sequence-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr34-operation-signal-sequence-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Reception Signal typing and repair UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Core metamodel: a Reception may only accept a modeled Signal.
          replace_once(
              'crates/model-core/src/model.rs',
              '        ElementKind::Parameter | ElementKind::InstanceSpecification => any_classifier,\n        _ => true,',
              '        ElementKind::Parameter | ElementKind::InstanceSpecification => any_classifier,\n        ElementKind::Reception => matches!(type_kind, ElementKind::Signal),\n        _ => true,',
          )

          # Desktop BDD creation: Reception must be created with its accepted Signal type.
          replace_once(
              'apps/desktop/src-tauri/src/workspace/bdd_elements.rs',
              '        ElementKind::EnumerationLiteral\n        | ElementKind::Slot\n        | ElementKind::Operation\n        | ElementKind::Reception => project\n            .create_element(kind, name, owner_id)\n            .map_err(|error| error.to_string())?,\n        ElementKind::PartProperty',
              '        ElementKind::EnumerationLiteral | ElementKind::Slot | ElementKind::Operation => project\n            .create_element(kind, name, owner_id)\n            .map_err(|error| error.to_string())?,\n        ElementKind::Reception => {\n            let type_id = type_id.ok_or_else(|| {\n                "Reception requires a modeled Signal stable type ID".to_string()\n            })?;\n            let id = project\n                .create_element(ElementKind::Reception, name, owner_id)\n                .map_err(|error| error.to_string())?;\n            project\n                .set_element_type(id, parse_element_id(&type_id)?)\n                .map_err(|error| error.to_string())?;\n            id\n        }\n        ElementKind::PartProperty',
          )

          # Existing Reception repair path: extend the existing details command with an optional type update.
          replace_once(
              'apps/desktop/src-tauri/src/workspace/bdd_elements.rs',
              'pub fn update_bdd_element_details(\n    element_id: String,\n    documentation: Option<String>,\n    default_value: Option<String>,\n    quantity_kind_external_id: Option<String>,\n    unit_external_id: Option<String>,\n    state: tauri::State<\'_ , WorkspaceState>,',
              'pub fn update_bdd_element_details(\n    element_id: String,\n    documentation: Option<String>,\n    default_value: Option<String>,\n    quantity_kind_external_id: Option<String>,\n    unit_external_id: Option<String>,\n    type_id: Option<String>,\n    state: tauri::State<\'_ , WorkspaceState>,',
          )
          # The exact Rust lifetime spacing is formatter-owned; retry the real source spelling if needed.
          p = Path('apps/desktop/src-tauri/src/workspace/bdd_elements.rs')
          text = p.read_text(encoding='utf-8')
          if '    type_id: Option<String>,\n    state: tauri::State' not in text:
              old = "pub fn update_bdd_element_details(\n    element_id: String,\n    documentation: Option<String>,\n    default_value: Option<String>,\n    quantity_kind_external_id: Option<String>,\n    unit_external_id: Option<String>,\n    state: tauri::State<'_, WorkspaceState>,"
              new = "pub fn update_bdd_element_details(\n    element_id: String,\n    documentation: Option<String>,\n    default_value: Option<String>,\n    quantity_kind_external_id: Option<String>,\n    unit_external_id: Option<String>,\n    type_id: Option<String>,\n    state: tauri::State<'_, WorkspaceState>,"
              if old not in text:
                  raise SystemExit('update_bdd_element_details signature anchor missing')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          replace_once(
              'apps/desktop/src-tauri/src/workspace/bdd_elements.rs',
              '    let project = project_guard.as_mut().ok_or("no project open")?;\n    let element = project\n        .element_mut(element_id)',
              '    let project = project_guard.as_mut().ok_or("no project open")?;\n    if let Some(type_id) = type_id {\n        project\n            .set_element_type(element_id, parse_element_id(&type_id)?)\n            .map_err(|error| error.to_string())?;\n    }\n    let element = project\n        .element_mut(element_id)',
          )

          # BDD UI creation: Reception prompts for a real modeled Signal without asking for multiplicity.
          replace_once(
              'apps/desktop/frontend/bdd-completion-ui.js',
              "    Parameter: ['Block', 'InterfaceBlock', 'ValueType', 'DataType', 'Enumeration'],\n    ConstraintParameter: ['ValueType', 'DataType', 'PrimitiveType', 'Enumeration'],",
              "    Parameter: ['Block', 'InterfaceBlock', 'ValueType', 'DataType', 'Enumeration'],\n    Reception: ['Signal'],\n    ConstraintParameter: ['ValueType', 'DataType', 'PrimitiveType', 'Enumeration'],",
          )
          replace_once(
              'apps/desktop/frontend/bdd-completion-ui.js',
              "  const typeId = BDD_TYPED_FEATURE_KINDS.has(semanticKind) ? await chooseTypeId(semanticKind) : null;\n  if (BDD_TYPED_FEATURE_KINDS.has(semanticKind) && !typeId) return;",
              "  const needsType = BDD_TYPED_FEATURE_KINDS.has(semanticKind) || semanticKind === 'Reception';\n  const typeId = needsType ? await chooseTypeId(semanticKind) : null;\n  if (needsType && !typeId) return;",
          )

          # Existing Reception editor: allow assigning/changing the accepted Signal in Properties.
          p = Path('apps/desktop/frontend/bdd-completion-ui.js')
          text = p.read_text(encoding='utf-8')
          anchor = "${element.type_id ? `<label>Type<input value=\"${escapeAttr(typeName(project, element))}\" disabled></label>` : ''}${element.multiplicity ?"
          replacement = "${element.type_id ? `<label>Type<input value=\"${escapeAttr(typeName(project, element))}\" disabled></label>` : ''}${element.kind === 'Reception' ? `<label>Accepted Signal<select id=\"property-reception-signal\"><option value=\"\">Select Signal</option>${project.elements.filter((candidate) => candidate.kind === 'Signal').map((candidate) => `<option value=\"${escapeAttr(candidate.id)}\" ${String(candidate.id) === String(element.type_id || '') ? 'selected' : ''}>${escapeHtml(candidate.name)}</option>`).join('')}</select></label>` : ''}${element.multiplicity ?"
          if anchor not in text:
              raise SystemExit('Reception properties insertion anchor missing')
          text = text.replace(anchor, replacement, 1)
          old_call = "await runCommand('Updating element details…', () => requireInvoke()('update_bdd_element_details', { elementId: element.id, documentation: $('property-documentation').value, defaultValue: $('property-default')?.value ?? null, quantityKindExternalId: $('property-quantity-kind')?.value ?? null, unitExternalId: $('property-unit')?.value ?? null }));"
          new_call = "await runCommand('Updating element details…', () => requireInvoke()('update_bdd_element_details', { elementId: element.id, documentation: $('property-documentation').value, defaultValue: $('property-default')?.value ?? null, quantityKindExternalId: $('property-quantity-kind')?.value ?? null, unitExternalId: $('property-unit')?.value ?? null, typeId: $('property-reception-signal')?.value || null }));"
          if old_call not in text:
              raise SystemExit('BDD details invoke anchor missing')
          text = text.replace(old_call, new_call, 1)
          p.write_text(text, encoding='utf-8')

          # Focused core regression: Receptions accept Signal classifiers only.
          test = Path('crates/model-core/tests/pr34_operation_signal_sequence.rs')
          text = test.read_text(encoding='utf-8')
          marker = 'fn reception_type_is_restricted_to_modeled_signal()'
          if marker not in text:
              text += '''\n\n#[test]\nfn reception_type_is_restricted_to_modeled_signal() {\n    let mut project = Project::new("Reception typing");\n    let package = project\n        .create_element(ElementKind::Package, "Pkg", project.root_id)\n        .unwrap();\n    let controller = project\n        .create_element(ElementKind::Block, "Controller", package)\n        .unwrap();\n    let wrong_type = project\n        .create_element(ElementKind::Block, "WrongType", package)\n        .unwrap();\n    let start = project\n        .create_element(ElementKind::Signal, "Start", package)\n        .unwrap();\n    let reception = project\n        .create_element(ElementKind::Reception, "receiveStart", controller)\n        .unwrap();\n\n    assert!(project.set_element_type(reception, wrong_type).is_err());\n    project.set_element_type(reception, start).unwrap();\n    assert_eq!(project.element(reception).unwrap().type_id, Some(start));\n}\n'''
              test.write_text(text, encoding='utf-8')
          PY

          cargo fmt --all -- --check || cargo fmt --all
          node --check apps/desktop/frontend/bdd-completion-ui.js
          cargo test -p systems-modeler-core --test pr34_operation_signal_sequence
          python scripts/validate_operation_signal_sequence_integration.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_rust_authority.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/model-core/src/model.rs apps/desktop/src-tauri/src/workspace/bdd_elements.rs apps/desktop/frontend/bdd-completion-ui.js crates/model-core/tests/pr34_operation_signal_sequence.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR34: type Receptions by modeled Signals"
          git push origin HEAD:agent/pr34-operation-signal-sequence-runtime
