name: PR35 Parametric runtime staging

on:
  push:
    branches: [agent/pr35-native-parametric-runtime]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finish PR35 integration
        shell: bash
        run: |
          python scripts/pr35_finish.py
          python <<'PY'
          from pathlib import Path
          path = Path('crates/model-core/tests/pr35_parametric_runtime.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let mut session = session(&fixture.project, fixture.context);\n    let mut engine = ParametricExecutionEngine::new(fixture.scope.clone());\n    engine.initialize(&fixture.project, &mut session).unwrap();\n    engine.step(&fixture.project, &mut session).unwrap();\n    assert_eq!(session.state, ExecutionState::Failed);\n    assert!(\n        session\n            .diagnostics\n            .last()\n            .unwrap()\n            .message\n            .contains("unsupported expression character")\n    );\n}'''
          new = '''    let mut session = session(&fixture.project, fixture.context);\n    let mut engine = ParametricExecutionEngine::new(fixture.scope.clone());\n    match engine.initialize(&fixture.project, &mut session) {\n        Ok(()) => {\n            engine.step(&fixture.project, &mut session).unwrap();\n            assert_eq!(session.state, ExecutionState::Failed);\n            assert!(\n                session\n                    .diagnostics\n                    .last()\n                    .unwrap()\n                    .message\n                    .contains("unsupported expression character")\n            );\n        }\n        Err(error) => {\n            assert!(error.to_string().contains("unsupported expression character"));\n        }\n    }\n}'''
          if old not in text:
              raise SystemExit('unsupported-expression test anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          node --check apps/desktop/frontend/parametric-ui.js
          node --check apps/desktop/frontend/behavior-authoritative-renderer.js
          python scripts/validate_parametric_integration.py
          python scripts/validate_parametric_runtime_integration.py
          cargo test -p systems-modeler-core --test pr35_parametric_runtime
          cargo check -p systems-modeler-desktop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR35: wire native Parametric runtime"
          git push origin HEAD:agent/pr35-native-parametric-runtime
