name: PR35 Parametric runtime staging

on:
  push:
    branches: [agent/pr35-native-parametric-runtime]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire PR35 runtime into existing surfaces
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def rep(path, old, new, count=None):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:100]!r}')
              write(path, text.replace(old, new) if count is None else text.replace(old, new, count))

          rep('crates/model-core/src/lib.rs',
              'pub mod operation_signal_sequence_execution;\npub use operation_signal_sequence_execution::*;\n',
              'pub mod operation_signal_sequence_execution;\npub use operation_signal_sequence_execution::*;\n\npub mod parametric_execution;\npub use parametric_execution::*;\n')
          rep('crates/model-core/src/parametrics.rs',
              '#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ParametricEvaluationScope {',
              '#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub struct ParametricEvaluationScope {')

          p = 'apps/desktop/src-tauri/src/workspace/parametrics.rs'
          rep(p, 'fn diagram_context(diagram: &BddDiagram) -> Result<ElementId, String> {',
                 'pub(super) fn diagram_context(diagram: &BddDiagram) -> Result<ElementId, String> {')
          anchor = '''fn parameter_layout(
              parameters: &[&systems_modeler_core::Element],
              width: f64,
              height: f64,
          ) -> Vec<ConstraintParameterPresentation> {'''
          helper = '''pub(super) fn evaluation_scope(
              diagram: &BddDiagram,
              project: &Project,
          ) -> Result<ParametricEvaluationScope, String> {
              Ok(ParametricEvaluationScope {
                  context_id: diagram_context(diagram)?,
                  constraint_property_ids: diagram.nodes.iter().filter_map(|node| {
                      let id = parse_element_id(&node.element_id).ok()?;
                      (project.element(id).ok()?.kind == ElementKind::ConstraintProperty).then_some(id)
                  }).collect(),
                  value_property_ids: diagram.nodes.iter().filter_map(|node| {
                      let id = parse_element_id(&node.element_id).ok()?;
                      (project.element(id).ok()?.kind == ElementKind::ValueProperty).then_some(id)
                  }).collect(),
                  binding_relationship_ids: diagram.edges.iter()
                      .map(|edge| parse_relationship_id(&edge.relationship_id))
                      .collect::<Result<Vec<_>, _>>()?,
              })
          }

          ''' + anchor
          rep(p, anchor, helper)
          rep(p,
              '''    let report = evaluate_parametrics(&mut project, &scope).map_err(|error| error.to_string())?;
              project.validate().map_err(|error| error.to_string())?;
              if !report.updates.is_empty() {
                  checkpoint(&workspace, &activity, &history)?;
                  *workspace
                      .project
                      .lock()
                      .map_err(|_| "project lock poisoned")? = Some(project);
              }
              Ok(ParametricEvaluationSnapshot {''',
              '''    let report = evaluate_parametrics(&mut project, &scope).map_err(|error| error.to_string())?;
              // PR35 legacy direct evaluation is preview-only. Transient analysis
              // values are owned by the shared ExecutionSession runtime path.
              let _ = (&activity, &history);
              Ok(ParametricEvaluationSnapshot {''')

          m = 'apps/desktop/src-tauri/src/main.rs'
          rep(m, '    mod parametrics;\n    mod presentation_interaction;',
                 '    mod parametrics;\n    mod parametric_execution;\n    mod presentation_interaction;')
          rep(m, '''    pub use parametrics::{
              create_binding_connector, create_constraint_parameter,
              create_parametric_constraint_property, create_parametric_diagram,
              create_parametric_value_property, delete_binding_connector, evaluate_parametric_diagram,
              place_on_parametric_diagram, reconnect_binding_connector, update_constraint_block_details,
              update_constraint_parameter, update_constraint_parameter_presentation,
              update_parametric_constraint_property, update_parametric_presentation_geometry,
              update_parametric_value_property, update_quantity_kind_details, update_unit_details,
              update_value_type_details,
          };
          ''', '''    pub use parametrics::{
              create_binding_connector, create_constraint_parameter,
              create_parametric_constraint_property, create_parametric_diagram,
              create_parametric_value_property, delete_binding_connector, evaluate_parametric_diagram,
              place_on_parametric_diagram, reconnect_binding_connector, update_constraint_block_details,
              update_constraint_parameter, update_constraint_parameter_presentation,
              update_parametric_constraint_property, update_parametric_presentation_geometry,
              update_parametric_value_property, update_quantity_kind_details, update_unit_details,
              update_value_type_details,
          };
              pub use parametric_execution::{
              ParametricExecutionState, clear_parametric_executions,
              configure_parametric_execution_runtime, evaluate_parametric_execution,
              initialize_parametric_execution, parametric_execution_runtime_selection,
              parametric_execution_snapshot, preview_parametric_execution_runtime,
              reset_parametric_execution, run_parametric_execution, step_parametric_execution,
              terminate_parametric_execution,
          };
          ''')
          rep(m, '    ActivityExecutionState, ActivityWorkspaceState, HistoryState, SequenceExecutionState,\n    SharedWorkspaceState, StandardEditingState, StateMachineExecutionState, WorkspaceState,',
                 '    ActivityExecutionState, ActivityWorkspaceState, HistoryState, ParametricExecutionState,\n    SequenceExecutionState, SharedWorkspaceState, StandardEditingState, StateMachineExecutionState,\n    WorkspaceState,')
          rep(m, '    clear_sequence_executions, clear_state_machine_executions, clear_workspace_interaction,',
                 '    clear_parametric_executions, clear_sequence_executions, clear_state_machine_executions,\n    clear_workspace_interaction,')
          rep(m, '    clear_workspace_interaction,\n    configure_activity_execution_runtime, configure_sequence_execution_runtime,',
                 '    clear_workspace_interaction,\n    configure_activity_execution_runtime, configure_parametric_execution_runtime,\n    configure_sequence_execution_runtime,')
          rep(m, '    diagram_family_registry, duplicate_selection, evaluate_parametric_diagram,',
                 '    diagram_family_registry, duplicate_selection, evaluate_parametric_diagram,\n    evaluate_parametric_execution,')
          rep(m, '    ibd_item_flow_notation, initialize_activity_execution, initialize_sequence_execution,\n    initialize_state_machine_execution, load_activity_workspace, move_active_selection,',
                 '    ibd_item_flow_notation, initialize_activity_execution, initialize_parametric_execution,\n    initialize_sequence_execution, initialize_state_machine_execution, load_activity_workspace,\n    move_active_selection,')
          rep(m, '    preview_activity_execution_runtime, preview_sequence_execution_runtime,\n    preview_state_machine_execution_runtime, queue_state_machine_signal, reconnect_activity_edge,',
                 '    preview_activity_execution_runtime, preview_parametric_execution_runtime,\n    preview_sequence_execution_runtime, preview_state_machine_execution_runtime,\n    queue_state_machine_signal, reconnect_activity_edge,')
          rep(m, '    reset_activity_execution, reset_activity_workspace, reset_sequence_execution,\n    reset_state_machine_execution, resize_sequence_lifeline_timeline, resume_activity_execution,',
                 '    reset_activity_execution, reset_activity_workspace, reset_parametric_execution,\n    reset_sequence_execution, reset_state_machine_execution, resize_sequence_lifeline_timeline,\n    resume_activity_execution,')
          rep(m, '    route_behavior_diagram, route_diagram_geometry, route_ibd, run_activity_execution,\n    run_sequence_execution, run_state_machine_execution, save_activity_workspace,',
                 '    route_behavior_diagram, route_diagram_geometry, route_ibd, run_activity_execution,\n    run_parametric_execution, run_sequence_execution, run_state_machine_execution,\n    save_activity_workspace,')
          rep(m, '    sequence_execution_runtime_selection, sequence_execution_snapshot,\n    set_diagram_frame_preference,',
                 '    parametric_execution_runtime_selection, parametric_execution_snapshot,\n    sequence_execution_runtime_selection, sequence_execution_snapshot,\n    set_diagram_frame_preference,')
          rep(m, '    state_machine_execution_snapshot, step_activity_execution, step_sequence_execution,\n    step_state_machine_execution, terminate_activity_execution, terminate_sequence_execution,\n    terminate_state_machine_execution,',
                 '    state_machine_execution_snapshot, step_activity_execution, step_parametric_execution,\n    step_sequence_execution, step_state_machine_execution, terminate_activity_execution,\n    terminate_parametric_execution, terminate_sequence_execution, terminate_state_machine_execution,')
          rep(m, '        .manage(SequenceExecutionState::default())\n        .manage(HistoryState::default())',
                 '        .manage(SequenceExecutionState::default())\n        .manage(ParametricExecutionState::default())\n        .manage(HistoryState::default())')
          rep(m, '            evaluate_parametric_diagram,\n            create_use_case_diagram,',
                 '''            evaluate_parametric_diagram,
                          parametric_execution_snapshot,
                          parametric_execution_runtime_selection,
                          preview_parametric_execution_runtime,
                          configure_parametric_execution_runtime,
                          initialize_parametric_execution,
                          evaluate_parametric_execution,
                          run_parametric_execution,
                          step_parametric_execution,
                          reset_parametric_execution,
                          terminate_parametric_execution,
                          clear_parametric_executions,
                          create_use_case_diagram,''')

          rep('apps/desktop/src-tauri/src/workspace/presentation_theme.rs',
              'rust_adapter: Some("evaluate_parametric_diagram")',
              'rust_adapter: Some("evaluate_parametric_execution")')

          r = 'apps/desktop/frontend/behavior-authoritative-renderer.js'
          rep(r, '''    if (kind === 'sequence') return {
              get: 'sequence_execution_runtime_selection',
              preview: 'preview_sequence_execution_runtime',
              configure: 'configure_sequence_execution_runtime',
              label: 'Sequence',
          };
          return {''', '''    if (kind === 'sequence') return {
              get: 'sequence_execution_runtime_selection',
              preview: 'preview_sequence_execution_runtime',
              configure: 'configure_sequence_execution_runtime',
              label: 'Sequence',
          };
          if (kind === 'parametric') return {
              get: 'parametric_execution_runtime_selection',
              preview: 'preview_parametric_execution_runtime',
              configure: 'configure_parametric_execution_runtime',
              label: 'Parametric',
          };
          return {''')
          rep(r, 'Choose the structural system occurrence this behavior executes on. Rust validates and owns the resulting runtime graph.',
                 'Choose the structural system occurrence this execution runs on. Rust validates and owns the resulting runtime graph.')
          rep(r, '''        if (kind === 'activity') {
              window.smpState.activityExecutionSnapshot = null;
              window.smpRefreshActivityExecution?.();
            } else {
              window.smpState.stateMachineExecutionSnapshot = null;
              window.smpRefreshStateMachineExecution?.();
            }''', '''        if (kind === 'activity') {
              window.smpState.activityExecutionSnapshot = null;
              window.smpRefreshActivityExecution?.();
            } else if (kind === 'sequence') {
              window.smpState.sequenceExecutionSnapshot = null;
              window.smpRefreshSequenceExecution?.();
            } else if (kind === 'parametric') {
              window.smpState.parametricExecutionSnapshot = null;
              window.smpRefreshParametricExecution?.();
            } else {
              window.smpState.stateMachineExecutionSnapshot = null;
              window.smpRefreshStateMachineExecution?.();
            }''')
          rep(r, "    await requireInvoke()('clear_sequence_executions');\n    Object.assign(state, { stateMachineExecutionSnapshot: null });",
                 "    await requireInvoke()('clear_sequence_executions');\n    await requireInvoke()('clear_parametric_executions');\n    Object.assign(state, { stateMachineExecutionSnapshot: null, parametricExecutionSnapshot: null });")

          f = 'apps/desktop/frontend/parametric-ui.js'
          text = read(f)
          anchor = '''  function selectedParametricDiagram() {
              return (state.snapshot?.diagrams || []).find(
                (diagram) => diagram.id === state.selectedDiagramId && diagram.family === 'parametric',
              );
            }
          '''
          runtime = r'''

            Object.assign(state, { parametricExecutionSnapshot: null });

            function parametricExecutionSnapshot() {
              const diagram = selectedParametricDiagram();
              const snapshot = state.parametricExecutionSnapshot;
              return snapshot && diagram && String(snapshot.context_id) === String(diagram.semantic_context_id) ? snapshot : null;
            }

            function visualizeParametricExecution() {
              const snapshot = parametricExecutionSnapshot();
              const calculated = new Set((snapshot?.updates || []).map((update) => String(update.element_id)));
              const evaluated = new Set((snapshot?.evaluated_constraint_property_ids || []).map(String));
              document.querySelectorAll('.parametric-presentation').forEach((node) => {
                const id = String(node.dataset.elementId || '');
                node.classList.toggle('runtime-calculated-value', calculated.has(id));
                node.classList.toggle('runtime-evaluated-constraint', evaluated.has(id));
              });
            }

            function renderParametricExecutionPanel() {
              const host = document.querySelector('.diagram-workspace');
              const snapshot = parametricExecutionSnapshot();
              let panel = document.querySelector('.parametric-execution-panel');
              if (!host || !snapshot) { panel?.remove(); return; }
              if (!panel) { panel = document.createElement('aside'); panel.className = 'parametric-execution-panel'; panel.dataset.workspaceOverlay = 'true'; host.appendChild(panel); }
              const execution = snapshot.execution;
              const diagnostics = (execution.diagnostics || []).slice(-4);
              const trace = (execution.trace || []).slice(-6);
              const updates = snapshot.updates || [];
              panel.innerHTML = `<div class="parametric-execution-heading"><strong>${escapeHtml(execution.state)}</strong><span>${escapeHtml(snapshot.runtime_instance_path || 'model scope')}</span></div>
                <div class="parametric-execution-metrics"><span>Step ${execution.steps_executed}</span><span>${snapshot.evaluated_constraints || 0} constraint(s)</span><span>${updates.length} calculated value(s)</span></div>
                ${updates.length ? `<div class="parametric-execution-values">${updates.map((update) => `<div><b>${escapeHtml(update.element_name)}</b><span>${escapeHtml(update.display_value)}</span></div>`).join('')}</div>` : ''}
                ${diagnostics.length ? `<div class="parametric-execution-diagnostics">${diagnostics.map((item) => `<div class="runtime-${String(item.severity).toLowerCase()}">${escapeHtml(item.message)}</div>`).join('')}</div>` : ''}
                <div class="parametric-execution-trace">${trace.map((item) => `<div><span>${item.simulation_time}</span>${escapeHtml(item.message)}</div>`).join('')}</div>
                ${window.renderStructuralRuntimeInspector?.(snapshot) || ''}`;
            }

            function refreshParametricExecution() {
              const visible = Boolean(selectedParametricDiagram());
              let group = document.querySelector('.parametric-execution-ribbon-group');
              if (!group) {
                group = document.createElement('section');
                group.className = 'ribbon-group parametric-execution-ribbon-group';
                const controls = [['runtime','◎','Runtime'],['initialize','◇','Initialize'],['evaluate','▶','Evaluate'],['step','▸','Step'],['reset','↺','Reset'],['terminate','■','Terminate']];
                group.innerHTML = `<div class="ribbon-actions parametric-execution-actions">${controls.map(([command, icon, label]) => `<button class="ribbon-command" data-parametric-execution="${command}"><span class="command-icon">${icon}</span><span>${label}</span></button>`).join('')}</div><div class="ribbon-label">Parametric Execution</div>`;
                group.addEventListener('click', handleParametricExecutionCommand);
                document.querySelector('.ribbon')?.insertBefore(group, document.querySelector('.ribbon-context'));
              }
              group.hidden = !visible;
              const snapshot = parametricExecutionSnapshot();
              const current = snapshot?.execution?.state || 'Not initialized';
              group.querySelectorAll('[data-parametric-execution]').forEach((button) => {
                const command = button.dataset.parametricExecution;
                button.disabled = !visible || (command === 'step' && (!snapshot || ['Completed','Failed','Terminated'].includes(current))) || (command === 'reset' && !snapshot) || (command === 'terminate' && (!snapshot || ['Completed','Failed','Terminated'].includes(current)));
              });
              visualizeParametricExecution();
              renderParametricExecutionPanel();
            }

            async function invokeParametricExecution(command) {
              const diagram = selectedParametricDiagram();
              if (!diagram) throw new Error('Open a Parametric Diagram first.');
              const snapshot = await requireInvoke()(command, { diagramId: diagram.id });
              Object.assign(state, { parametricExecutionSnapshot: snapshot });
              refreshParametricExecution();
              return snapshot;
            }
            const initializeParametricExecution = () => invokeParametricExecution('initialize_parametric_execution');
            const evaluateParametricRuntime = () => invokeParametricExecution('evaluate_parametric_execution');

            async function handleParametricExecutionCommand(event) {
              const command = event.target.closest?.('[data-parametric-execution]')?.dataset.parametricExecution;
              if (!command) return;
              try {
                if (command === 'runtime') {
                  const diagram = selectedParametricDiagram();
                  await window.smpOpenStructuralRuntimeConfiguration?.('parametric', diagram.id);
                  Object.assign(state, { parametricExecutionSnapshot: null });
                  refreshParametricExecution();
                } else if (command === 'initialize') await initializeParametricExecution();
                else if (command === 'evaluate') await evaluateParametricRuntime();
                else if (command === 'step') await invokeParametricExecution('step_parametric_execution');
                else if (command === 'reset') await invokeParametricExecution('reset_parametric_execution');
                else if (command === 'terminate') await invokeParametricExecution('terminate_parametric_execution');
              } catch (error) { window.smpDialogs?.notify?.(error?.message || String(error), 'error'); refreshParametricExecution(); }
            }

            async function loadParametricExecutionSnapshot() {
              const diagram = selectedParametricDiagram();
              if (!diagram) { Object.assign(state, { parametricExecutionSnapshot: null }); refreshParametricExecution(); return; }
              try {
                const snapshot = await requireInvoke()('parametric_execution_snapshot', { diagramId: diagram.id });
                Object.assign(state, { parametricExecutionSnapshot: snapshot });
              } catch (_error) { Object.assign(state, { parametricExecutionSnapshot: null }); }
              refreshParametricExecution();
            }
            window.smpRefreshParametricExecution = refreshParametricExecution;
            window.smpEvaluateParametricRuntime = evaluateParametricRuntime;
          '''
          if anchor not in text: raise SystemExit('missing parametric UI insertion anchor')
          text = text.replace(anchor, anchor + runtime, 1)
          text = text.replace('      presentation.dataset.presentationId = node.id;', '      presentation.dataset.presentationId = node.id;\n      presentation.dataset.elementId = property.id;', 1)
          click = '''    frame.onclick = async (event) => {
              if (state.paletteTool?.category === 'element') {
                const point = diagramCoordinates(frame, event);
                await createPaletteElementAt(state.paletteTool, point.x, point.y);
                return;
              }
              Object.assign(state, {
                selectedElementId: null,
                selectedRelationshipId: null,
                pendingRelationship: null,
                paletteTool: null,
              });
              render();
            };
          };'''
          if click not in text: raise SystemExit('missing parametric render end anchor')
          text = text.replace(click, click[:-4] + '    queueMicrotask(loadParametricExecutionSnapshot);\n  };', 1)
          old = '''    panel.innerHTML = `<div class="property-heading">Parametric Diagram</div>
              <label>Name<input value="${escapeAttr(diagram.name)}" disabled></label>
              <label>Semantic context<input value="${escapeAttr(`${context?.name || 'Unresolved'} (${context?.kind || '?'})`)}" disabled></label>
              <div class="parametric-evaluation-summary">Evaluation is explicit. Opening the diagram never changes engineering values.</div>
              <button id="evaluate-parametrics" class="primary">Evaluate Parametrics</button>`;
            $('evaluate-parametrics').onclick = async () => {
              const result = await runCommand('Evaluating Parametrics…', () => requireInvoke()('evaluate_parametric_diagram', {
                diagramId: diagram.id,
              }));
              await refresh();
              renderStatus(`Evaluated ${result.evaluated_constraints} constraint(s); ${result.changed_values} value(s) changed.`);
            };'''
          new = '''    panel.innerHTML = `<div class="property-heading">Parametric Diagram</div>
              <label>Name<input value="${escapeAttr(diagram.name)}" disabled></label>
              <label>Semantic context<input value="${escapeAttr(`${context?.name || 'Unresolved'} (${context?.kind || '?'})`)}" disabled></label>
              <div class="parametric-evaluation-summary">Runtime evaluation is transient and occurrence-scoped. Opening or evaluating the diagram never rewrites authored ValueProperty defaults.</div>
              <button id="evaluate-parametrics" class="primary">Evaluate Runtime</button>`;
            $('evaluate-parametrics').onclick = async () => {
              const result = await runCommand('Evaluating Parametric runtime…', () => evaluateParametricRuntime());
              renderStatus(`Evaluated ${result.evaluated_constraints} constraint(s); ${result.updates?.length || 0} runtime value(s) calculated.`);
            };'''
          if old not in text: raise SystemExit('missing parametric properties anchor')
          write(f, text.replace(old, new, 1))

          c = 'apps/desktop/frontend/structural-runtime.css'
          rep(c, 'body:not([data-execution-family="sequence"]) .sequence-execution-ribbon-group {',
                 'body:not([data-execution-family="sequence"]) .sequence-execution-ribbon-group,\nbody:not([data-execution-family="parametric"]) .parametric-execution-ribbon-group {')
          rep(c, '.sequence-execution-ribbon-group {', '.sequence-execution-ribbon-group,\n.parametric-execution-ribbon-group {')
          rep(c, '.sequence-execution-ribbon-group .ribbon-actions {', '.sequence-execution-ribbon-group .ribbon-actions,\n.parametric-execution-ribbon-group .ribbon-actions {')
          rep(c, '.sequence-execution-ribbon-group .ribbon-label {', '.sequence-execution-ribbon-group .ribbon-label,\n.parametric-execution-ribbon-group .ribbon-label {')
          rep(c, '.sequence-execution-ribbon-group .ribbon-command {', '.sequence-execution-ribbon-group .ribbon-command,\n.parametric-execution-ribbon-group .ribbon-command {')
          with Path(c).open('a', encoding='utf-8') as h:
              h.write('''\n.parametric-execution-actions{display:flex;flex-wrap:nowrap;gap:4px}.parametric-execution-panel{position:absolute;right:16px;bottom:16px;z-index:12;width:min(440px,40vw);max-height:46vh;overflow:auto;background:rgba(255,255,255,.96);border:1px solid #9aa6b2;border-radius:4px;box-shadow:0 5px 18px rgba(30,42,55,.18);padding:10px;font-size:12px}body:not([data-execution-family="parametric"]) .parametric-execution-panel{display:none!important}.parametric-execution-heading,.parametric-execution-metrics{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.parametric-execution-values{display:grid;gap:3px;margin:6px 0}.parametric-execution-values>div{display:flex;justify-content:space-between;gap:10px}.parametric-execution-trace>div{display:grid;grid-template-columns:70px 1fr;gap:6px;padding:2px 0}.parametric-execution-diagnostics{margin:6px 0;color:#9b1c1c}.parametric-presentation.runtime-calculated-value{outline:2px solid currentColor;outline-offset:2px}.parametric-presentation.runtime-evaluated-constraint{box-shadow:0 0 0 2px rgba(0,0,0,.16)}\n''')

          v = 'scripts/validate_parametric_integration.py'
          rep(v, 'assert \'rust_adapter: Some("evaluate_parametric_diagram")\' in manifest',
                 'assert \'rust_adapter: Some("evaluate_parametric_execution")\' in manifest')
          rep(v, '    "Evaluate Parametrics",', '    "Evaluate Runtime",')

          ci = '.github/workflows/ci.yml'
          rep(ci, '      - name: Parametric desktop integration contract\n        run: python scripts/validate_parametric_integration.py\n',
                  '      - name: Parametric desktop integration contract\n        run: python scripts/validate_parametric_integration.py\n      - name: Parametric runtime integration contract\n        run: python scripts/validate_parametric_runtime_integration.py\n')

          write('docs/PR35_NATIVE_PARAMETRIC_RUNTIME.md', '''# PR35 Native Parametric Runtime and Constraint Evaluation Integration

          PR35 integrates the existing PR25 SysML Parametric semantics with the shared PR31–PR34 execution architecture. It does not introduce a second simulator, clock, event queue, runtime value store, or frontend semantic store.

          ## Runtime contract
          - Constraint expressions remain Rust-owned authored data on `ConstraintBlock`.
          - PR25 type, multiplicity, QuantityKind, dimension, unit, producer, dependency, and cycle validation remains authoritative.
          - The bounded grammar remains `output = expression` with numeric literals, parameter references, parentheses, unary minus, `+ - * / ^`, and deterministic dependency ordering.
          - `ParametricExecutionEngine` overlays one selected structural occurrence's `ExecutionSession` values onto a scratch project, reuses the PR25 evaluator, and writes calculated values only to the shared transient runtime store.
          - Evaluation never rewrites authored `ValueProperty.default_value`, diagram geometry, routing, frames, pan/zoom, or semantic ownership.
          - Repeated classifier occurrences require an unambiguous runtime selection and remain value-isolated.
          - One Parametric execution step performs one bounded evaluation pass; Reset rebuilds authored runtime defaults and replays deterministically.

          ## Explicit boundaries
          PR35 does not add arbitrary symbolic rearrangement, nonlinear numerical solvers, differential equations, optimization, Monte Carlo, external MATLAB/Python execution, arbitrary scripts, or a new unit-conversion framework. Unsupported expressions and unresolved/ambiguous/overconstrained/cyclic models fail with diagnostics rather than guessed values. PR36 unified-kernel work is out of scope.

          ## Manual qualification fixture
          Use Block `Vehicle` with `mass : Real = 1000`, `acceleration : Real = 2`, and derived `force : Real`. Define ConstraintBlock `ForceEquation` with parameters `m : Real`, `a : Real`, `F : Real` and expression `F = m * a`. Create `forceEquation : ForceEquation` and bind `mass ↔ m`, `acceleration ↔ a`, `force ↔ F` on a Parametric Diagram. Configure Runtime to the `Vehicle` occurrence, Initialize, then Evaluate. The transient result must be `force = 2000`; the authored `force` default remains unchanged. With repeated Vehicle occurrences, select each independently and verify values do not cross occurrences.

          Do not merge automatically. Do not begin PR36 before PR35 is merged.
          ''')
          Path('.github/workflows/pr35-implement-runtime.yml').unlink()
          PY
          cargo fmt --all
          node --check apps/desktop/frontend/parametric-ui.js
          node --check apps/desktop/frontend/behavior-authoritative-renderer.js
          python scripts/validate_parametric_integration.py
          python scripts/validate_parametric_runtime_integration.py
          cargo test -p systems-modeler-core --test pr35_parametric_runtime
          cargo check -p systems-modeler-desktop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR35: wire native Parametric runtime"
          git push origin HEAD:agent/pr35-native-parametric-runtime
