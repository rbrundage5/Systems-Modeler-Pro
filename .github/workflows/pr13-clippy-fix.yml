name: pr13-clippy-fix

on:
  push:
    branches:
      - agent/pr13-activity-rust

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr13-activity-rust
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply narrow Clippy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src-tauri/src/workspace/activity_editing.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        ActivityNodeKind::Decision {
            decision_input: value,
        } => {
            if decision_input.is_some() {
                *value = decision_input.filter(|text| !text.is_empty());
            }
        }
        ActivityNodeKind::Join {
            join_specification: value,
        } => {
            if join_specification.is_some() {
                *value = join_specification.filter(|text| !text.is_empty());
            }
        }
'''
          new = '''        ActivityNodeKind::Decision {
            decision_input: value,
        } if decision_input.is_some() => {
            *value = decision_input.filter(|text| !text.is_empty());
        }
        ActivityNodeKind::Join {
            join_specification: value,
        } if join_specification.is_some() => {
            *value = join_specification.filter(|text| !text.is_empty());
        }
'''
          if old not in text:
              raise SystemExit('expected Activity update match block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          rm .github/workflows/pr13-clippy-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/src/workspace/activity_editing.rs .github/workflows/pr13-clippy-fix.yml
          git commit -m "fix: satisfy strict clippy for Activity property editing"
          git push origin HEAD:agent/pr13-activity-rust
