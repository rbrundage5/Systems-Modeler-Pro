name: pr66-bootstrap

on:
  push:
    branches: [agent/pr66-native-model-script-blank-state-hardening]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr66-native-model-script-blank-state-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply native blank-state patch
        run: python scripts/pr66_bootstrap.py
      - name: Format
        run: cargo fmt --all
      - name: Model-script qualification contract
        run: python scripts/validate_model_script_import_qualification.py
      - name: Focused model-script regression tests
        run: cargo test -p systems-modeler-desktop model_script -- --nocapture
      - name: Desktop compile
        run: cargo check -p systems-modeler-desktop
      - name: Desktop lint
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Commit qualified PR66 implementation
        run: |
          rm scripts/pr66_bootstrap.py
          rm .github/workflows/pr66-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR66: isolate blank model-script specialized state natively"
          git push origin HEAD:agent/pr66-native-model-script-blank-state-hardening
