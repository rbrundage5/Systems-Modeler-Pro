name: pr42-ci-fix

on:
  push:
    branches:
      - agent/pr42-native-allocation-import

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr42-native-allocation-import
      - uses: dtolnay/rust-toolchain@stable
      - name: Update stale PR41 unknown-kind fixture
        shell: pwsh
        run: |
          $path = 'apps/desktop/src-tauri/src/workspace/spreadsheet_import.rs'
          $text = [System.IO.File]::ReadAllText($path)
          $old = 'ALLOC-1,allocate,BLK-1,REQ-DUP,unsupported'
          $new = 'UNSUP-1,NotARelationship,BLK-1,REQ-DUP,unsupported'
          if (-not $text.Contains($old)) { throw "Expected stale PR41 fixture was not found" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text)
      - name: Format
        run: cargo fmt --all
      - name: Targeted regression
        run: cargo test -p systems-modeler-desktop pr41_requirement_id_ambiguity_unresolved_and_unknown_kind_are_blocked -- --nocapture
      - name: Commit fix and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/pr42-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR42: preserve PR41 unsupported-kind regression"
          git push origin HEAD:agent/pr42-native-allocation-import
