name: PR33 one-shot semantic hardening

on:
  push:
    branches:
      - agent/pr33-structural-runtime

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr33-structural-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply semantic hardening
        run: |
          python .github/scripts/pr33_semantic_hardening.py
          python .github/scripts/pr33_semantic_compat.py
      - name: Format and qualify semantic hardening
        run: |
          cargo fmt --all
          cargo test -p systems-modeler-core --test pr33_structural_runtime
          cargo test -p systems-modeler-core
          cargo clippy -p systems-modeler-core --all-targets -- -D warnings
      - name: Remove migration helpers and publish hardening
        run: |
          rm .github/workflows/pr33-one-shot-semantic-hardening.yml
          rm .github/scripts/pr33_semantic_hardening.py
          rm .github/scripts/pr33_semantic_compat.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR33: harden structural runtime semantics and qualification'
          git push origin HEAD:agent/pr33-structural-runtime
