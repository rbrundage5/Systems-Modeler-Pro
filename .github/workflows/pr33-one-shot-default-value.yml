name: PR33 one-shot default value fix

on:
  push:
    branches:
      - agent/pr33-structural-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/agent/pr33-structural-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr33-structural-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Parse authored quoted text defaults semantically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/model-core/src/structural_runtime.rs')
          text = path.read_text()
          old = '''                let value = evaluate_execution_expression(authored, |_| None)
                    .unwrap_or_else(|_| RuntimeValue::Text(authored.to_string()));'''
          new = '''                let value = parse_authored_runtime_default(authored);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one authored-default parser occurrence, found {text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '''fn endpoint_key(endpoint: &RuntimeEndpoint) -> Option<RuntimePortKey> {'''
          helper = '''fn parse_authored_runtime_default(authored: &str) -> RuntimeValue {
    if let Ok(value) = evaluate_execution_expression(authored, |_| None) {
        return value;
    }
    if let Ok(text) = serde_json::from_str::<String>(authored) {
        return RuntimeValue::Text(text);
    }
    RuntimeValue::Text(authored.to_string())
}

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one helper anchor, found {text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY
      - name: Format and qualify focused PR33 runtime
        run: |
          cargo fmt --all
          cargo test -p systems-modeler-core --test pr33_structural_runtime
      - name: Remove one-shot workflow and publish semantic fix
        shell: bash
        run: |
          rm .github/workflows/pr33-one-shot-default-value.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR33: parse authored text defaults for runtime values'
          git push origin HEAD:agent/pr33-structural-runtime
