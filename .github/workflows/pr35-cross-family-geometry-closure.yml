name: PR35 cross-family geometry closure

on:
  push:
    branches:
      - agent/pr35-native-parametric-runtime
    paths:
      - .github/workflows/pr35-cross-family-geometry-closure.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Retry after aligning the behavior integration contract with shared state geometry authority.
      - name: Apply cross-family geometry closure
        run: python scripts/pr35_cross_family_geometry_closure.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Frontend syntax
        run: |
          node --check apps/desktop/frontend/diagram-interaction.js
          node --check apps/desktop/frontend/interaction-runtime-fixes.js
          node --check apps/desktop/frontend/state-bar-resize.js
          node --check apps/desktop/frontend/behavior-authoritative-renderer.js
          node --check apps/desktop/frontend/parametric-ui.js

      - name: Shared geometry and authoring contracts
        run: |
          python scripts/validate_presentation_interaction.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_workspace_convergence.py
          python scripts/validate_behavior_integration.py
          python scripts/validate_activity_integration.py
          python scripts/validate_parametric_integration.py
          python scripts/validate_parametric_runtime_integration.py
          python scripts/validate_history_integration.py
          python scripts/validate_rust_authority.py

      - name: Core compile for changed Rust modules
        run: cargo check --workspace --exclude systems-modeler-desktop

      - name: Diff check
        run: git diff --check

      - name: Publish closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr35-cross-family-geometry-closure.yml scripts/pr35_cross_family_geometry_closure.py
          git add apps/desktop/frontend/diagram-interaction.js \
                  apps/desktop/frontend/interaction-runtime-fixes.js \
                  apps/desktop/frontend/state-bar-resize.js \
                  apps/desktop/frontend/behavior-authoritative-renderer.js \
                  apps/desktop/frontend/parametric-ui.js \
                  apps/desktop/src-tauri/src/workspace/presentation_interaction.rs \
                  apps/desktop/src-tauri/src/workspace/behavior_workspace.rs \
                  apps/desktop/src-tauri/src/workspace/parametrics.rs \
                  scripts/validate_presentation_interaction.py \
                  scripts/validate_parametric_integration.py
          git commit -m "PR35: close cross-family move and resize regressions"
          git push origin HEAD:agent/pr35-native-parametric-runtime
