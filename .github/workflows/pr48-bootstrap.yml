name: pr48-bootstrap
on:
  push:
    branches:
      - agent/pr48-activity-state-machine-import
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr48-activity-state-machine-import
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply staged PR48 implementation
        run: |
          python scripts/pr48_identity_patch.py
          python scripts/pr48_build_patch.py
          python scripts/pr48_completion_patch.py
      - name: Format
        run: cargo fmt --all --check
      - name: PR48 identity tests
        run: cargo test -p systems-modeler-core --test pr48_specialized_external_identity -- --nocapture
      - name: Core check
        run: cargo check -p systems-modeler-core
      - name: Core clippy
        run: cargo clippy -p systems-modeler-core --all-targets -- -D warnings
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr48-activity-state-machine-import
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply staged PR48 implementation
        run: |
          python scripts/pr48_identity_patch.py
          python scripts/pr48_build_patch.py
          python scripts/pr48_spreadsheet_patch.py
          python scripts/pr48_completion_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Desktop check
        run: cargo check -p systems-modeler-desktop
      - name: PR48 unified candidate tests
        run: cargo test -p systems-modeler-desktop bulk_model::pr48_tests -- --nocapture
      - name: PR48 spreadsheet behavior tests
        run: cargo test -p systems-modeler-desktop spreadsheet_import::pr48_tests -- --nocapture
      - name: Desktop clippy
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
