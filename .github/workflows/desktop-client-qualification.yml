name: desktop-client-qualification
on:
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/src/collaboration.rs'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - '.github/workflows/desktop-client-qualification.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare formatting and dependency patch
        shell: bash
        run: |
          cargo fmt --all
          cargo metadata --format-version 1 > /dev/null
          git diff --binary > desktop-client-preparation.patch
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-client-preparation
          path: desktop-client-preparation.patch
      - name: Focused client tests
        run: cargo test --locked -p systems-modeler-desktop collaboration
      - name: Desktop lint
        run: cargo clippy --locked -p systems-modeler-desktop --all-targets -- -D warnings
