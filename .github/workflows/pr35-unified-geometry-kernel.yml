name: PR35 unified geometry kernel repair

on:
  push:
    branches:
      - agent/pr35-native-parametric-runtime
    paths:
      - .github/workflows/pr35-unified-geometry-kernel.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr35-native-parametric-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply shared geometry repair
        run: python scripts/pr35_unify_geometry_kernel.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Frontend syntax
        run: |
          node --check apps/desktop/frontend/diagram-interaction.js
          node --check apps/desktop/frontend/app.js
          node --check apps/desktop/frontend/ibd-ui.js
          node --check apps/desktop/frontend/shared-workspace.js

      - name: Shared editing contracts
        run: |
          python scripts/validate_presentation_interaction.py
          python scripts/validate_standard_editing_integration.py
          python scripts/validate_workspace_convergence.py
          python scripts/validate_parametric_runtime_integration.py
          python scripts/validate_rust_authority.py

      - name: Diff check
        run: git diff --check

      - name: Publish repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr35-unified-geometry-kernel.yml scripts/pr35_unify_geometry_kernel.py
          git add apps/desktop/frontend/diagram-interaction.js \
                  apps/desktop/src-tauri/src/workspace/presentation_interaction.rs \
                  scripts/validate_presentation_interaction.py
          git commit -m "PR35: unify cross-family move and resize kernel"
          git push origin HEAD:agent/pr35-native-parametric-runtime
