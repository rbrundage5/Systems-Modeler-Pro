name: PR52 ReqIF integration qualification

on:
  push:
    branches:
      - agent/pr52-complete-reqif-interchange

permissions:
  contents: write

jobs:
  integrate-reqif:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr52-complete-reqif-interchange
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply ReqIF integration
        run: python scripts/pr52_integrate.py

      - name: Format
        run: cargo fmt --all

      - name: Focused ReqIF parser tests
        run: 'cargo test -p systems-modeler-desktop workspace::reqif_interchange::tests:: -- --nocapture'

      - name: Focused ReqIF runtime tests
        run: 'cargo test -p systems-modeler-desktop workspace::reqif_runtime::tests:: -- --nocapture'

      - name: Desktop compile check
        run: cargo check -p systems-modeler-desktop

      - name: Publish coherent ReqIF foundation
        shell: pwsh
        run: |
          git rm .github/workflows/pr52-integrate.yml scripts/pr52_integrate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR52: integrate ReqIF import reimport and export foundation'
          git push origin HEAD:agent/pr52-complete-reqif-interchange
