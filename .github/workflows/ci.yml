name: native-foundation-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format
        run: cargo fmt --all --check
      - name: Core and persistence tests
        run: cargo test --workspace --exclude systems-modeler-desktop
      - name: Core and persistence lint
        run: cargo clippy --workspace --exclude systems-modeler-desktop --all-targets -- -D warnings
      - name: Behavior frontend syntax
        shell: bash
        run: |
          for file in \
            apps/desktop/frontend/behavior-ui.js \
            apps/desktop/frontend/behavior-ribbon.js \
            apps/desktop/frontend/ui-shell.js \
            apps/desktop/frontend/behavior-completion-ui.js \
            apps/desktop/frontend/behavior-atomic-message.js \
            apps/desktop/frontend/behavior-delete-ui.js \
            apps/desktop/frontend/behavior-message-notation.js \
            apps/desktop/frontend/behavior-submachine.js \
            apps/desktop/frontend/behavior-region-placement.js \
            apps/desktop/frontend/behavior-sequence-input.js \
            apps/desktop/frontend/behavior-command-authority.js \
            apps/desktop/frontend/behavior-authoritative-renderer.js; do
            node --check "$file"
          done
      - name: Behavior desktop integration contract
        run: python scripts/validate_behavior_integration.py

  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check desktop shell
        run: cargo check -p systems-modeler-desktop
      - name: Desktop tests
        run: cargo test -p systems-modeler-desktop
      - name: Desktop lint
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Behavior desktop integration contract
        run: python scripts/validate_behavior_integration.py
      - name: Verify Cargo.lock remains clean
        shell: pwsh
        run: git diff --exit-code -- Cargo.lock

  finalize-unified-workspace:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr12-state-sequence-rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source transformation
        run: python scripts/pr12_apply_unified_snapshot.py
      - name: Format and verify portable gates
        run: |
          cargo fmt --all
          node --check apps/desktop/frontend/app.js
          node --check apps/desktop/frontend/behavior-ui.js
          node --check apps/desktop/frontend/behavior-command-authority.js
          python scripts/validate_behavior_integration.py
          cargo test --workspace --exclude systems-modeler-desktop
      - name: Commit verified source repair if needed
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/desktop/src-tauri/src/workspace.rs \
            apps/desktop/src-tauri/src/workspace/behavior_workspace.rs \
            apps/desktop/frontend/app.js \
            apps/desktop/frontend/behavior-ui.js \
            apps/desktop/frontend/behavior-command-authority.js \
            scripts/validate_behavior_integration.py; then
            echo "Unified snapshot source already applied; nothing to publish."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/desktop/src-tauri/src/workspace.rs \
            apps/desktop/src-tauri/src/workspace/behavior_workspace.rs \
            apps/desktop/frontend/app.js \
            apps/desktop/frontend/behavior-ui.js \
            apps/desktop/frontend/behavior-command-authority.js \
            scripts/validate_behavior_integration.py
          git commit -m "Unify workspace snapshot and behavior save-open persistence"
          git push
