name: pr41-final-qualification

on:
  push:
    branches: [agent/pr41-requirements-traceability-import]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr41-requirements-traceability-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply PR41 implementation
        run: python scripts/pr41_patch.py
      - name: Apply PR41 regression compatibility fix
        run: python scripts/pr41_regression_fix.py
      - name: Add PR41 focused tests and fixture
        run: python scripts/pr41_tests.py
      - name: Format
        run: cargo fmt --all
      - name: Check desktop
        run: cargo check -p systems-modeler-desktop
      - name: PR38 through PR41 spreadsheet regression
        run: cargo test -p systems-modeler-desktop spreadsheet_import -- --nocapture
      - name: PR36 bulk construction regression
        run: cargo test -p systems-modeler-desktop bulk_model
      - name: PR37 portable interchange regression
        run: cargo test -p systems-modeler-desktop portable_interchange
      - name: Desktop regression gate
        run: cargo test -p systems-modeler-desktop
      - name: Model-core regression gate
        run: cargo test -p systems-modeler-core
      - name: Persistence regression gate
        run: cargo test -p systems-modeler-persistence
      - name: Desktop lint
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Commit qualified PR41 result
        shell: pwsh
        run: |
          Remove-Item scripts/pr41_patch.py
          Remove-Item scripts/pr41_tests.py
          Remove-Item .github/workflows/pr41-focused.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR41: CATIA-style requirements traceability relationship import"
          git push origin HEAD:agent/pr41-requirements-traceability-import
