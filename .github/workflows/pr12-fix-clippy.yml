name: pr12-fix-clippy
on:
  push:
    branches: [agent/pr12-state-sequence-rust]
    paths: [.github/workflows/pr12-fix-clippy.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr12-state-sequence-rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix collapsible if lints
        shell: python
        run: |
          from pathlib import Path
          p=Path('crates/model-core/src/behavior.rs')
          s=p.read_text()
          old='''    if let Some(MessageSignature::Operation(id)) = message.signature {\n        if project.element(id)?.kind != ElementKind::Operation { return Err(BehaviorError::InvalidOperation(id)); }\n    }\n    if let Some(MessageSignature::Signal(id)) = message.signature {\n        if project.element(id)?.kind != ElementKind::Signal { return Err(BehaviorError::InvalidSignal(id)); }\n    }'''
          new='''    if let Some(MessageSignature::Operation(id)) = message.signature\n        && project.element(id)?.kind != ElementKind::Operation\n    {\n        return Err(BehaviorError::InvalidOperation(id));\n    }\n    if let Some(MessageSignature::Signal(id)) = message.signature\n        && project.element(id)?.kind != ElementKind::Signal\n    {\n        return Err(BehaviorError::InvalidSignal(id));\n    }'''
          if old not in s:
              raise SystemExit('expected behavior.rs fragment not found')
          p.write_text(s.replace(old,new))
      - name: Format and validate core
        run: |
          cargo fmt --all
          cargo test -p systems-modeler-core
          cargo clippy -p systems-modeler-core -- -D warnings
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/model-core/src/behavior.rs
          git commit -m "Fix behavior Clippy lints"
          git push
