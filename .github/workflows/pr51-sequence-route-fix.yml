name: PR51 native presentation repair

on:
  push:
    branches:
      - agent/pr51-complete-groovy-automation

permissions:
  contents: write

jobs:
  repair-native-presentation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr51-complete-groovy-automation
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply deterministic repair
        run: python scripts/pr51_repair.py

      - name: Verify formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Run focused PR51 qualification
        run: cargo test -p systems-modeler-desktop workspace::model_script::tests::

      - name: Run complete desktop regression suite
        run: cargo test -p systems-modeler-desktop

      - name: Run desktop Clippy with warnings denied
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings

      - name: Verify frontend syntax
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/frontend -Filter *.js | ForEach-Object { node --check $_.FullName }

      - name: Verify Rust architectural authority
        run: python scripts/validate_rust_authority.py

      - name: Publish qualified repair
        shell: pwsh
        run: |
          git rm .github/workflows/pr51-sequence-route-fix.yml scripts/pr51_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR51: preserve native connector and sequence presentation semantics'
          git push origin HEAD:agent/pr51-complete-groovy-automation
