name: PR51 sequence routing repair

on:
  push:
    branches:
      - agent/pr51-complete-groovy-automation

permissions:
  contents: write

jobs:
  repair-sequence-routing:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr51-complete-groovy-automation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair sequence message clearance
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/src/workspace/behavior_workspace.rs')
          text = path.read_text(encoding='utf-8')
          old = '        let y = 110.0 + f64::from(order) * 4.0;\n'
          new = (
              '        // Keep even the earliest legal occurrence below the lifeline header plus\n'
              '        // shared routing clearance. This prevents Clean Layout/Route from\n'
              '        // generating geometry that the obstacle-safe router must reject.\n'
              '        let y = 130.0 + f64::from(order) * 4.0;\n'
          )
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('sequence message Y-position anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Format Rust
        run: cargo fmt --all
      - name: Run PR51 model-script tests
        run: cargo test -p systems-modeler-desktop workspace::model_script::tests::
      - name: Publish repair and remove temporary workflow
        shell: pwsh
        run: |
          git rm .github/workflows/pr51-sequence-route-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR51: keep sequence routes clear of lifeline headers'
          git push origin HEAD:agent/pr51-complete-groovy-automation
