name: PR51 native presentation repair

on:
  push:
    branches:
      - agent/pr51-complete-groovy-automation

permissions:
  contents: write

jobs:
  repair-native-presentation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr51-complete-groovy-automation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Repair sequence and IBD generated presentation semantics
        shell: python
        run: |
          from pathlib import Path

          behavior_path = Path('apps/desktop/src-tauri/src/workspace/behavior_workspace.rs')
          behavior = behavior_path.read_text(encoding='utf-8')
          replacements = {
              '        let top = 110.0 + f64::from(execution.start.order) * 4.0;\n':
                  '        let top = 130.0 + f64::from(execution.start.order) * 4.0;\n',
              '        let bottom = 110.0 + f64::from(execution.finish.order) * 4.0;\n':
                  '        let bottom = 130.0 + f64::from(execution.finish.order) * 4.0;\n',
              '        let y = 110.0 + f64::from(order) * 4.0;\n':
                  '        // Keep the earliest message below the lifeline header plus the shared\n'
                  '        // routing clearance so Route/Clean Layout cannot generate geometry\n'
                  '        // that the obstacle-safe router must immediately reject.\n'
                  '        let y = 130.0 + f64::from(order) * 4.0;\n',
          }
          for old, new in replacements.items():
              if old in behavior:
                  behavior = behavior.replace(old, new, 1)
              elif new not in behavior:
                  raise SystemExit(f'missing expected behavior routing source: {old!r}')
          behavior_path.write_text(behavior, encoding='utf-8')

          script_path = Path('apps/desktop/src-tauri/src/workspace/model_script.rs')
          script = script_path.read_text(encoding='utf-8')

          old_property = '''                        ElementKind::PartProperty | ElementKind::ReferenceProperty => {
                            native.properties.push(IbdPropertyPresentation {
                                id: uuid::Uuid::new_v4().to_string(),
                                element_id: feature.id.to_string(),
                                property_path: vec![feature.id.to_string()],
                                x,
                                y,
                                width: 190.0,
                                height: 100.0,
                                ports: Vec::new(),
                            });
                            x += 240.0;
                            if x > 780.0 {
                                x = 120.0;
                                y += 180.0;
                            }
                        }
          '''
          new_property = '''                        ElementKind::PartProperty | ElementKind::ReferenceProperty => {
                            // A semantic connector end may terminate at a port owned by the
                            // property's type. Populate those native nested-port presentations
                            // up front so presentation endpoints can reconstruct ConnectorEnd
                            // exactly rather than falling back to the owning property box.
                            let typed_ports = feature
                                .type_id
                                .map(|type_id| {
                                    project
                                        .children(type_id)
                                        .filter(|candidate| candidate.is_port())
                                        .map(|candidate| candidate.id)
                                        .collect::<Vec<_>>()
                                })
                                .unwrap_or_default();
                            let port_rows = typed_ports.len().div_ceil(2);
                            let height = 100.0_f64.max(52.0 + port_rows as f64 * 28.0);
                            let ports = typed_ports
                                .into_iter()
                                .enumerate()
                                .map(|(index, port_id)| {
                                    let right_side = index % 2 == 0;
                                    let row = index / 2;
                                    IbdPortPresentation {
                                        id: uuid::Uuid::new_v4().to_string(),
                                        element_id: port_id.to_string(),
                                        property_path: vec![feature.id.to_string()],
                                        x: if right_side { x + 190.0 } else { x },
                                        y: y + 34.0 + row as f64 * 28.0,
                                        size: 16.0,
                                    }
                                })
                                .collect();
                            native.properties.push(IbdPropertyPresentation {
                                id: uuid::Uuid::new_v4().to_string(),
                                element_id: feature.id.to_string(),
                                property_path: vec![feature.id.to_string()],
                                x,
                                y,
                                width: 190.0,
                                height,
                                ports,
                            });
                            x += 240.0;
                            if x > 780.0 {
                                x = 120.0;
                                y += height + 80.0;
                            }
                        }
          '''
          if old_property in script:
              script = script.replace(old_property, new_property, 1)
          elif new_property not in script:
              raise SystemExit('IBD property population block not found')

          old_endpoint = '''                    let endpoint = |role: ElementId, port: Option<ElementId>| -> Option<String> {
                        let wanted = port.unwrap_or(role).to_string();
                        native
                            .boundary_ports
                            .iter()
                            .find(|p| p.element_id == wanted)
                            .map(|p| p.id.clone())
                            .or_else(|| {
                                native
                                    .properties
                                    .iter()
                                    .find(|p| p.element_id == role.to_string())
                                    .map(|p| p.id.clone())
                            })
                    };
                    if let (Some(source), Some(target)) = (
                        endpoint(connector.source.role_id, connector.source.port_id),
                        endpoint(connector.target.role_id, connector.target.port_id),
                    ) {
          '''
          new_endpoint = '''                    let endpoint = |end: &systems_modeler_core::ConnectorEnd| -> Option<String> {
                        let path = end
                            .property_path
                            .iter()
                            .map(ToString::to_string)
                            .collect::<Vec<_>>();
                        match end.port_id {
                            Some(port_id) if path.is_empty() => native
                                .boundary_ports
                                .iter()
                                .find(|presentation| {
                                    presentation.element_id == port_id.to_string()
                                        && presentation.property_path.is_empty()
                                })
                                .map(|presentation| presentation.id.clone()),
                            Some(port_id) => native
                                .properties
                                .iter()
                                .flat_map(|property| property.ports.iter())
                                .find(|presentation| {
                                    presentation.element_id == port_id.to_string()
                                        && presentation.property_path == path
                                })
                                .map(|presentation| presentation.id.clone()),
                            None => native
                                .properties
                                .iter()
                                .find(|presentation| {
                                    presentation.element_id == end.role_id.to_string()
                                        && presentation.property_path == path
                                })
                                .map(|presentation| presentation.id.clone()),
                        }
                    };
                    if let (Some(source), Some(target)) = (
                        endpoint(&connector.source),
                        endpoint(&connector.target),
                    ) {
          '''
          if old_endpoint in script:
              script = script.replace(old_endpoint, new_endpoint, 1)
          elif new_endpoint not in script:
              raise SystemExit('IBD connector endpoint population block not found')

          script_path.write_text(script, encoding='utf-8')

      - name: Format Rust
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run focused PR51 qualification
        run: cargo test -p systems-modeler-desktop workspace::model_script::tests::

      - name: Run complete desktop regression suite
        run: cargo test -p systems-modeler-desktop

      - name: Run desktop Clippy with warnings denied
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings

      - name: Verify frontend syntax
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/frontend -Filter *.js | ForEach-Object { node --check $_.FullName }

      - name: Verify Rust architectural authority
        run: python scripts/validate_rust_authority.py

      - name: Publish qualified repair and remove temporary workflow
        shell: pwsh
        run: |
          git rm .github/workflows/pr51-sequence-route-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR51: preserve native connector and sequence presentation semantics'
          git push origin HEAD:agent/pr51-complete-groovy-automation
