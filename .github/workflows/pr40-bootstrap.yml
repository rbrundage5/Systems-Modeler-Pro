name: pr40-bootstrap

on:
  push:
    branches: [agent/pr40-core-relationship-import]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr40-core-relationship-import
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply focused PR40 core patch
        run: python scripts/pr40_patch.py
      - name: Apply PR40 focused fixes
        run: python scripts/pr40_fix.py
      - name: Add PR40 focused tests
        run: python scripts/pr40_tests.py
      - name: Apply PR40 post-test correction
        run: python scripts/pr40_post_tests_fix.py
      - name: Apply PR40 Clippy cleanup
        run: python scripts/pr40_clippy_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Check desktop
        run: cargo check -p systems-modeler-desktop
      - name: PR38 through PR40 spreadsheet tests
        run: cargo test -p systems-modeler-desktop spreadsheet_import -- --nocapture
      - name: PR36 bulk construction regression
        run: cargo test -p systems-modeler-desktop bulk_model
      - name: PR37 portable interchange regression
        run: cargo test -p systems-modeler-desktop portable_interchange
      - name: Desktop regression gate
        run: cargo test -p systems-modeler-desktop
      - name: Model-core regression gate
        run: cargo test -p systems-modeler-core
      - name: Persistence regression gate
        run: cargo test -p systems-modeler-persistence
      - name: Desktop lint
        run: cargo clippy -p systems-modeler-desktop --all-targets -- -D warnings
      - name: Commit qualified PR40 result
        shell: pwsh
        run: |
          Remove-Item scripts/pr40_patch.py
          Remove-Item scripts/pr40_fix.py
          Remove-Item scripts/pr40_tests.py
          Remove-Item scripts/pr40_post_tests_fix.py
          Remove-Item scripts/pr40_clippy_fix.py
          Remove-Item .github/workflows/pr40-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR40: CATIA-style core relationship import"
          git push origin HEAD:agent/pr40-core-relationship-import
