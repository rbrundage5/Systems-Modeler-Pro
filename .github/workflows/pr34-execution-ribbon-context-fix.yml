name: PR34 execution ribbon context fix

on:
  push:
    branches:
      - agent/pr34-operation-signal-sequence-runtime

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr34-operation-signal-sequence-runtime
          fetch-depth: 0
      - name: Bind execution ribbons to the authoritative active diagram family
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workspace = Path('apps/desktop/frontend/shared-workspace.js')
          text = workspace.read_text(encoding='utf-8')
          old = "canvas.setAttribute('aria-label',context?.family.accessibilityName||'Diagram canvas'); canvas.dataset.family=context?.family.id||''; document.getElementById('workspace-header').dataset.family=context?.family.id||'';"
          new = "canvas.setAttribute('aria-label',context?.family.accessibilityName||'Diagram canvas'); canvas.dataset.family=context?.family.id||''; document.body.dataset.executionFamily=context?.family.id||''; document.getElementById('workspace-header').dataset.family=context?.family.id||'';"
          if old not in text and new not in text:
              raise SystemExit('shared-workspace updateHeader anchor not found')
          if new not in text:
              text = text.replace(old, new, 1)
              workspace.write_text(text, encoding='utf-8')

          css = Path('apps/desktop/frontend/structural-runtime.css')
          css_text = css.read_text(encoding='utf-8')
          old_css = """body:not(:has(#canvas .activity-svg)) .activity-execution-ribbon-group,\nbody:not(:has(#canvas .state-machine-frame)) .state-machine-execution-ribbon-group {\n  display: none !important;\n}\n"""
          new_css = """body:not([data-execution-family=\"activity\"]) .activity-execution-ribbon-group,\nbody:not([data-execution-family=\"state-machine\"]) .state-machine-execution-ribbon-group,\nbody:not([data-execution-family=\"sequence\"]) .sequence-execution-ribbon-group {\n  display: none !important;\n}\n"""
          if old_css not in css_text and new_css not in css_text:
              raise SystemExit('structural runtime contextual ribbon anchor not found')
          if new_css not in css_text:
              css_text = css_text.replace(old_css, new_css, 1)
          css_text = css_text.replace(
              '.activity-execution-ribbon-group,\n.state-machine-execution-ribbon-group {',
              '.activity-execution-ribbon-group,\n.state-machine-execution-ribbon-group,\n.sequence-execution-ribbon-group {',
          )
          css_text = css_text.replace(
              '.activity-execution-ribbon-group .ribbon-actions,\n.state-machine-execution-ribbon-group .ribbon-actions {',
              '.activity-execution-ribbon-group .ribbon-actions,\n.state-machine-execution-ribbon-group .ribbon-actions,\n.sequence-execution-ribbon-group .ribbon-actions {',
          )
          css_text = css_text.replace(
              '.activity-execution-ribbon-group .ribbon-label,\n.state-machine-execution-ribbon-group .ribbon-label {',
              '.activity-execution-ribbon-group .ribbon-label,\n.state-machine-execution-ribbon-group .ribbon-label,\n.sequence-execution-ribbon-group .ribbon-label {',
          )
          css_text = css_text.replace(
              '.activity-execution-ribbon-group .ribbon-command,\n.state-machine-execution-ribbon-group .ribbon-command {',
              '.activity-execution-ribbon-group .ribbon-command,\n.state-machine-execution-ribbon-group .ribbon-command,\n.sequence-execution-ribbon-group .ribbon-command {',
          )
          css.write_text(css_text, encoding='utf-8')

          Path('.github/workflows/pr34-execution-ribbon-context-fix.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR34: bind execution ribbon to active diagram family"
          git push origin HEAD:agent/pr34-operation-signal-sequence-runtime
